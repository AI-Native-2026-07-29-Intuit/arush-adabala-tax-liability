# taxcalc-ai/pyproject.toml
[project]
name = "taxcalc-ai"
version = "0.1.0"
description = "Python sidecar for taxcalc-api - liability estimation via the W3 D1 LLM proxy."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langsmith>=0.1.80",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    # Upper-bounded deliberately. ragas 0.4 deprecates essentially the entire surface this
    # project uses - the metric singletons, LangchainLLMWrapper, LangchainEmbeddingsWrapper and
    # `evaluate` itself - in favour of ragas.metrics.collections plus llm_factory. That is a
    # coherent destination, but llm_factory returns an InstructorLLM which is NOT a BaseRagasLLM
    # (checked, not assumed), so it is an all-or-nothing migration, and it cannot be validated
    # end to end while the evaluator workspace is spend-capped. Carrying four warning exemptions
    # to keep a deprecated API quiet is worse than pinning to the version where that API is the
    # current one; the pin is a single reviewable decision with an obvious expiry. Revisit when
    # the evaluator can actually run.
    "ragas>=0.1.10,<0.3",
    "great-expectations>=0.18",
    "testcontainers[postgres]>=4.7",
    "langchain-community<0.4",
    "pandas-stubs>=3.0.5.260914",
    "langchain-anthropic>=0.2",
    "anthropic>=0.40",
    "langchain-huggingface>=0.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxcalc_ai"]

[tool.mypy]
# The Pydantic plugin is what lets --strict see through the models: without it mypy sees the
# synthesised `__init__(**data: Any)` (which `disallow_any_explicit` then rejects) and knows
# nothing about `populate_by_name` aliases.
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
disallow_any_explicit = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["build/", "dist/"]

# Neither `datasets` nor `ragas` (at the <0.3 pin) ships a py.typed marker, so --strict refuses
# those imports outright rather than treating them as Any. Scoped to these two package trees: a
# blanket ignore_missing_imports would switch the same protection off for every third-party
# package, including the ones that DO ship types - pandas via pandas-stubs, numpy, psycopg,
# pgvector, sentence-transformers, langsmith, great-expectations.
#
# Worth noting the direction of travel: ragas 0.4 DOES ship py.typed, so this half of the
# override expires with the pin above rather than being permanent.
[[tool.mypy.overrides]]
module = ["datasets.*", "ragas.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded because recent ruff formats Python code blocks inside .md files, and
# PROMPT_JOURNAL.md's blocks are VERBATIM transcripts of what Claude produced - including its
# line breaks. Reformatting them would rewrite the evidence the journal exists to preserve:
# a record of AI output that has been tidied is no longer a record of AI output. PYTHON.md
# quotes the same scaffolds for the same reason. Python in src/ and tests/ is unaffected.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E,F default; UP for pyupgrade; B for bugbear; SIM for simplify; I for isort.
select = ["E", "F", "UP", "B", "SIM", "I", "RUF", "T20"]
# T20 bans print() so library code stays log-only; the CLI entrypoint opts in.

[tool.ruff.lint.per-file-ignores]
"src/taxcalc_ai/cli.py" = ["T20"]  # the CLI is allowed to print()
# Operator/CI entrypoints report their verdict on stdout and exit with a status code; a gate
# whose output only reached a log handler would be invisible in the Actions UI.
"src/taxcalc_ai/scripts/*.py" = ["T20"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
# --strict-markers means an unregistered marker is an error, so `slow` is declared here rather
# than typo'd into silence at the one call site that uses it.
markers = [
    "slow: makes real network calls to an evaluator model; opt out locally with -m 'not slow'",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # secrets_dir points at the Kubernetes mount path, which does not exist on a laptop or on
    # a CI runner. The warning is correct and expected off-cluster; it is not a test failure.
    'ignore:directory "/run/secrets" does not exist:UserWarning',
    # great-expectations 1.x imports the stdlib `sre_constants`, deprecated since 3.11. It is
    # raised inside GX's own import chain, so no amount of care in this project's code avoids
    # it; the only alternatives are turning the whole filterwarnings=error policy off or not
    # importing GX. Scoped to the message so the policy holds everywhere else.
    # `sre_constants` and `sre_parse` are both pulled in by that same import chain.
    "ignore:module 'sre_.*' is deprecated:DeprecationWarning",
    # great-expectations' ephemeral context creates a TemporaryDirectory for a docs site and
    # never disposes of it; the GC cleans it up and the warning fires at teardown. It is GX's
    # own object, created inside get_context(), with no handle exposed to close it.
    #
    # Note what is NOT exempted here: the pooled SQLAlchemy connections behind GX's Postgres
    # data source leaked the same way, and that one the tests fix rather than silence - see the
    # `data_source.get_engine().dispose()` in tests/test_great_expectations_suite.py. A leak
    # this project can close gets closed; only the one it cannot reach is ignored.
    "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning",
    # ragas/_analytics.py does `json.load(open(uuid_filepath))` - an unclosed handle - inside an
    # lru_cache'd get_userid(), which is a pydantic default_factory on its event model. It runs
    # while the event object is BUILT, before track() consults RAGAS_DO_NOT_TRACK, so disabling
    # telemetry (which tests/conftest.py does anyway, for egress reasons) does not avoid it.
    # There is no seam to close the file from: it is an open() inside a cached function in a
    # dependency.
    'ignore:unclosed file .*ragas.*uuid\.json:ResourceWarning',
]
