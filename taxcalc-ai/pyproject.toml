# taxcalc-ai/pyproject.toml
[project]
name = "taxcalc-ai"
version = "0.1.0"
description = "Python sidecar for taxcalc-api - liability estimation via the W3 D1 LLM proxy."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langsmith>=0.1.80",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    "ragas>=0.1.10",
    "great-expectations>=0.18",
    "testcontainers[postgres]>=4.7",
    "langchain-community<0.4",
    "pandas-stubs>=3.0.5.260914",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxcalc_ai"]

[tool.mypy]
# The Pydantic plugin is what lets --strict see through the models: without it mypy sees the
# synthesised `__init__(**data: Any)` (which `disallow_any_explicit` then rejects) and knows
# nothing about `populate_by_name` aliases.
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
disallow_any_explicit = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["build/", "dist/"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F default; UP for pyupgrade; B for bugbear; SIM for simplify; I for isort.
select = ["E", "F", "UP", "B", "SIM", "I", "RUF", "T20"]
# T20 bans print() so library code stays log-only; the CLI entrypoint opts in.

[tool.ruff.lint.per-file-ignores]
"src/taxcalc_ai/cli.py" = ["T20"]  # the CLI is allowed to print()

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # secrets_dir points at the Kubernetes mount path, which does not exist on a laptop or on
    # a CI runner. The warning is correct and expected off-cluster; it is not a test failure.
    'ignore:directory "/run/secrets" does not exist:UserWarning',
]
