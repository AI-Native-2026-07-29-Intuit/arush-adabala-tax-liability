# taxcalc-mcp-server/pyproject.toml
# New uv project at the repo root; imports the W7 D3 sidecar (taxcalc-ai) as a path dependency.
[project]
name = "taxcalc-mcp-server"
version = "0.1.0"
description = "MCP server publishing four tools (orders.*, llm.chat, rag.retrieve_and_generate)."
requires-python = ">=3.12"
dependencies = [
    # Upper-bounded deliberately. mcp 2.x renames FastMCP to MCPServer and changes the
    # decorator and lifespan surfaces; the SDK itself suggests `mcp<2` to keep v1 code running.
    # Everything downstream of this server - the committed mcp.json, the Claude Desktop
    # launcher, and the W7 D5 agent - is written against the v1 FastMCP contract, so the pin is
    # what keeps that contract true rather than an avoidance of an upgrade. Moving to 2.x is a
    # rewrite of app.py + both transports, not a version bump.
    "mcp>=1.2,<2",               # FastMCP, stdio + SSE transports, McpError
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "langsmith>=0.1.80",
    "structlog>=24.1",           # structured JSON logging on stderr
    "pyjwt[crypto]>=2.8",        # local JWKS validation of the SSE bearer (defence in depth)
    # `taxcalc_ai.rag` imports the Anthropic SDK at module scope for the generation step. It is
    # a DEV dependency over in the sidecar (only its tests and eval harness constructed a
    # client), but importing that module in a server makes it a runtime one here.
    "anthropic>=0.40",
    # The W7 D3 sidecar as a path dependency (read-only library reuse):
    "taxcalc-ai",
]

[project.scripts]
taxcalc-mcp-server = "taxcalc_mcp_server.transports.stdio:main"
taxcalc-mcp-server-sse = "taxcalc_mcp_server.transports.sse:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    "testcontainers[postgres]>=4.7",
]

[tool.uv]
package = true

[tool.uv.sources]
taxcalc-ai = { path = "../taxcalc-ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxcalc_mcp_server"]

[tool.mypy]
# The Pydantic plugin is what lets --strict see through the models: without it mypy sees the
# synthesised `__init__(**data: Any)` and knows nothing about the field types.
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
exclude = ["build/", "dist/"]

# The MCP SDK ships py.typed, but FastMCP's decorators are generic over an untyped AnyFunction,
# so a decorated handler comes back as `Any` under --strict. Scoped to the SDK: every other
# import in this project is type-checked for real.
[[tool.mypy.overrides]]
module = ["mcp.*"]
follow_untyped_imports = true

# langsmith's @traceable is an untyped decorator: it returns a callable built through **kwargs,
# so --strict reports every traced function as "untyped decorator". Scoped to langsmith alone -
# the alternative is a `# type: ignore` on each traced handler, which states the same fact in as
# many places as there are tools instead of once, here.
[[tool.mypy.overrides]]
module = ["langsmith.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"
# PROMPT_JOURNAL.md's code blocks are verbatim transcripts of what Claude produced, including
# its line breaks; reformatting them would rewrite the evidence the journal exists to preserve.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "RUF", "T20", "SLF", "S"]
# T20 bans print() so nothing can reach stdout by accident - on the stdio transport stdout is
# the protocol. SLF flags private-member access, which this project does use (twice, both in
# app.py, both because mcp 1.x exposes no public equivalent) and both are explicitly noqa'd with
# a reason rather than allowed silently. S is bandit: a server that forwards credentials should
# not be the place where a hard-coded one slips in.

[tool.ruff.lint.per-file-ignores]
# Tests assert on values the linter reads as hard-coded credentials (S105/S106) and use `assert`
# (S101), which is what a test is made of.
"tests/*" = ["S101", "S105", "S106", "SLF001"]
# SLF001: a test that only exercises a module's public surface is not a unit test of that
# module's behaviour - `_doc_id_of`'s tolerance for an unexpected id shape is exactly the kind
# of decision that deserves a direct assertion rather than being reached through three layers.
# The replay script is an operator/CI entrypoint: it reports its verdict on stdout and exits
# with a status code. A gate whose output only reached a log handler would be invisible in the
# Actions UI.
"src/taxcalc_mcp_server/scripts/*.py" = ["T20"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "e2e: spins Docker containers via Testcontainers; runs on the merge-to-main CI tier only",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
