# slf4j-simple configuration for the taxcalc-taxpayer-lookup Lambda (W5 D4).
#
# System.out, not the slf4j-simple default of System.err: Lambda routes both to CloudWatch, but
# only stdout goes through the runtime's structured-log path that LoggingConfig.LogFormat: JSON
# wraps into a JSON envelope. Anything on stderr arrives as a bare line and breaks the "every log
# line is a JSON envelope" contract this function is graded on.
org.slf4j.simpleLogger.logFile=System.out

# The Lambda log router stamps its own timestamp, level, and request id onto the envelope, so
# repeating them inside the message would just duplicate every field.
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true

# ApplicationLogLevel in template.yaml is the real filter (Lambda drops anything below it before
# it reaches CloudWatch); this only has to be permissive enough not to filter first.
org.slf4j.simpleLogger.defaultLogLevel=info
