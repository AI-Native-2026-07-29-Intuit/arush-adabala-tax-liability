spring:
  application:
    name: taxcalc-service
  profiles:
    default: local
  config:
    # Reads each file under /run/secrets/ (the Compose secrets mount point - see
    # compose.yaml's top-level `secrets:` block) as a property named after the file.
    # `optional:` so this is a no-op wherever /run/secrets/ doesn't exist (IDE runs,
    # bootRun outside Docker, the `test` profile's Testcontainers-backed tests).
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    # pg_password comes from the mounted secrets/pg_password.txt file (via the
    # configtree import above) when present; DB_PASSWORD/devpass remain as
    # fallbacks for contexts with no mounted secret.
    password: ${pg_password:${DB_PASSWORD:devpass}}
    hikari:
      maximum-pool-size: 5
  flyway:
    connect-retries: 10               # (1a) some Docker setups (e.g. Rancher Desktop's proxy) can
                                       #      report a container ready before its port-forward
                                       #      actually accepts connections; retry instead of
                                       #      failing context startup on that transient refusal
  jpa:
    hibernate:
      ddl-auto: validate               # (1) NEVER 'update' or 'create' in this curriculum
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false                # (2) prevent the lazy-load-in-view anti-pattern
    show-sql: false                    # flip to true for local debugging only
  data:
    mongodb:
      uri: mongodb://localhost:27017/taxcalc     # (3) placeholder; tests inject via @ServiceConnection
      auto-index-creation: true                  # (4) create @Indexed indexes on startup
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 60000                        # (5) 60s TTL - short enough to bound staleness
      cache-null-values: false                   # (6) don't cache "not found"
  security:
    oauth2:
      resourceserver:
        jwt:
          # (7) Dummy IdP issuer for production wiring; tests override with a mock
          #     JwkSource via spring-security-test so they don't need a real IdP.
          issuer-uri: https://idp.example.internal/realms/uptimecrew
  kafka:
    bootstrap-servers: localhost:9092       # (7a) overridden by @ServiceConnection in tests
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # (7b) the outbox already stores a JSON string per row - StringSerializer publishes it
      # as-is; JsonSerializer would double-encode an already-JSON string.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: taxcalc-read-model-builder
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.uptimecrew.tax_liability.consumer.TaxpayerUpdatedEvent
        # (7c) the producer publishes plain JSON (no __TypeId__ header), so the deserializer
        # must be told the target type instead of trying to read it from a (non-existent) header.
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.uptimecrew.tax_liability.consumer
    listener:
      ack-mode: RECORD
  ai:
    mcp:
      server:
        name: taxcalc-mcp
        version: 1.0.0
        type: SYNC
        transport: SSE
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy}   # (9a) dummy default for local smoke-testing; the test profile below stubs ChatClient entirely so it never reads this
      chat:
        options:
          model: claude-sonnet-4-5
          max-tokens: 1024
  graphql:
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true             # GET /graphql/schema returns the SDL for inspection

otel:
  service:
    name: taxcalc-service
  exporter:
    otlp:
      endpoint: http://localhost:4318     # OTLP/HTTP default; matches the local Jaeger `docker run`
      protocol: http/protobuf
  traces:
    sampler: always_on                    # dev default; flip to parentbased_traceidratio in prod
  instrumentation:
    spring-kafka:
      enabled: true
    kafka:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always              # (8) so mongo/redis sub-health is visible over plain curl
      probes:
        enabled: true                   # (8c) exposes /actuator/health/{liveness,readiness} outside
                                         #      Kubernetes too - Boot only auto-enables them when it
                                         #      detects a K8s environment, but a plain `docker run`
                                         #      HEALTHCHECK (and the Docker Compose / Kubernetes
                                         #      probes W5 D2-D3 wire up) need the same two routes.

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

identity:
  base-url: http://localhost:8090       # (8a) WireMock stub address used by the contract test

resilience4j:
  circuitbreaker:
    instances:
      identity:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10          # (8b) must be <= slidingWindowSize or the failure-rate check never fires
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

taxcalc:
  strategies:
    flat-state:
      jurisdiction: COLORADO
      rate: 0.044
    no-income-tax-state:
      jurisdiction: TEXAS
    progressive-state:
      jurisdiction: CALIFORNIA
      brackets:
        - id: ca-bracket-1
          rate: 0.01
          floor: 0
          ceiling: 10412
        - id: ca-bracket-2
          rate: 0.02
          floor: 10412
          ceiling: 24684
        - id: ca-bracket-3
          rate: 0.04
          floor: 24684

logging:
  level:
    root: INFO
    com.uptimecrew.tax_liability: DEBUG   # turn up your own packages in local dev
    org.springframework.security.web: DEBUG   # (9) surfaces "Will secure ... with [DefaultSecurityFilterChain...]"
                                               #     on every request so the filter chain build is visible in bootRun

---
spring:
  config:
    activate:
      on-profile: docker
  # Baked into the Docker image as SPRING_PROFILES_ACTIVE=docker (see Dockerfile), so this
  # activates automatically on every `docker run` with zero extra flags. `localhost` inside a
  # bridge-networked container (`docker run -p 8080:8080 ...`, no `--network host`) means the
  # container itself, not the host machine, so Postgres/Mongo running on the host (or in sibling
  # containers with published ports) are unreachable at the `local` profile's `localhost` URLs -
  # Flyway/Mongo bean creation blocks context refresh forever waiting on a connection that will
  # never come. `host.docker.internal` is the Docker-provided DNS name for "the host machine";
  # Rancher Desktop and Docker Desktop resolve it automatically, no `--add-host` flag needed.
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/postgres
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/taxcalc
    redis:
      host: host.docker.internal
  kafka:
    bootstrap-servers: host.docker.internal:9092

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Testcontainers will inject a real URL at runtime; this is just a placeholder
    # so the bean wiring doesn't fail in test contexts that don't use a DB.
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test
  ai:
    anthropic:
      base-url: http://localhost:8092   # WireMock stub address used by LlmSummaryServiceAnthropicContractIT
  data:
    mongodb:
      # auto-index-creation eagerly opens a Mongo connection while building the
      # MongoTemplate bean during context startup, not lazily on first use - only
      # TaxpayerPolyglotIT boots a real Mongo container, so every other
      # @SpringBootTest (Postgres-only) would otherwise fail context refresh.
      auto-index-creation: false

otel:
  sdk:
    disabled: true    # no-op OpenTelemetry bean by default in tests; TaxpayerObservabilityIT
                       # overrides it with an @Primary InMemorySpanExporter-backed bean so only
                       # that test pays for real span export, and every other IT stays quiet.

logging:
  level:
    root: INFO

management:
  health:
    db:
      # test's spring.datasource.url is a placeholder (see comment above) - nothing
      # is listening on it outside a Testcontainers-backed test, so the DB health
      # check would otherwise drag /actuator/health to DOWN in every other test.
      enabled: false
    mongo:
      # same reasoning as db above: only TaxpayerPolyglotIT boots a real Mongo
      # container, so the health check is disabled everywhere else.
      enabled: false
    redis:
      # same reasoning as db above: only TaxpayerPolyglotIT boots a real Redis
      # container, so the health check is disabled everywhere else.
      enabled: false
    kafka:
      # same reasoning as db above: only TaxpayerEventFlowIT boots a real Kafka
      # container, so the health check is disabled everywhere else.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
