spring:
  application:
    name: taxcalc-service
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ${DB_PASSWORD:devpass}
    hikari:
      maximum-pool-size: 5
  flyway:
    connect-retries: 10               # (1a) some Docker setups (e.g. Rancher Desktop's proxy) can
                                       #      report a container ready before its port-forward
                                       #      actually accepts connections; retry instead of
                                       #      failing context startup on that transient refusal
  jpa:
    hibernate:
      ddl-auto: validate               # (1) NEVER 'update' or 'create' in this curriculum
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false                # (2) prevent the lazy-load-in-view anti-pattern
    show-sql: false                    # flip to true for local debugging only
  data:
    mongodb:
      uri: mongodb://localhost:27017/taxcalc     # (3) placeholder; tests inject via @ServiceConnection
      auto-index-creation: true                  # (4) create @Indexed indexes on startup
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 60000                        # (5) 60s TTL - short enough to bound staleness
      cache-null-values: false                   # (6) don't cache "not found"
  security:
    oauth2:
      resourceserver:
        jwt:
          # (7) Dummy IdP issuer for production wiring; tests override with a mock
          #     JwkSource via spring-security-test so they don't need a real IdP.
          issuer-uri: https://idp.example.internal/realms/uptimecrew
  kafka:
    bootstrap-servers: localhost:9092       # (7a) overridden by @ServiceConnection in tests
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # (7b) the outbox already stores a JSON string per row - StringSerializer publishes it
      # as-is; JsonSerializer would double-encode an already-JSON string.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always              # (8) so mongo/redis sub-health is visible over plain curl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

identity:
  base-url: http://localhost:8090       # (8a) WireMock stub address used by the contract test

resilience4j:
  circuitbreaker:
    instances:
      identity:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10          # (8b) must be <= slidingWindowSize or the failure-rate check never fires
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

taxcalc:
  strategies:
    flat-state:
      jurisdiction: COLORADO
      rate: 0.044
    no-income-tax-state:
      jurisdiction: TEXAS
    progressive-state:
      jurisdiction: CALIFORNIA
      brackets:
        - id: ca-bracket-1
          rate: 0.01
          floor: 0
          ceiling: 10412
        - id: ca-bracket-2
          rate: 0.02
          floor: 10412
          ceiling: 24684
        - id: ca-bracket-3
          rate: 0.04
          floor: 24684

logging:
  level:
    root: INFO
    com.uptimecrew.tax_liability: DEBUG   # turn up your own packages in local dev
    org.springframework.security.web: DEBUG   # (9) surfaces "Will secure ... with [DefaultSecurityFilterChain...]"
                                               #     on every request so the filter chain build is visible in bootRun

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Testcontainers will inject a real URL at runtime; this is just a placeholder
    # so the bean wiring doesn't fail in test contexts that don't use a DB.
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test
  data:
    mongodb:
      # auto-index-creation eagerly opens a Mongo connection while building the
      # MongoTemplate bean during context startup, not lazily on first use - only
      # TaxpayerPolyglotIT boots a real Mongo container, so every other
      # @SpringBootTest (Postgres-only) would otherwise fail context refresh.
      auto-index-creation: false

logging:
  level:
    root: INFO

management:
  health:
    db:
      # test's spring.datasource.url is a placeholder (see comment above) - nothing
      # is listening on it outside a Testcontainers-backed test, so the DB health
      # check would otherwise drag /actuator/health to DOWN in every other test.
      enabled: false
    mongo:
      # same reasoning as db above: only TaxpayerPolyglotIT boots a real Mongo
      # container, so the health check is disabled everywhere else.
      enabled: false
    redis:
      # same reasoning as db above: only TaxpayerPolyglotIT boots a real Redis
      # container, so the health check is disabled everywhere else.
      enabled: false
    kafka:
      # same reasoning as db above: only TaxpayerEventFlowIT boots a real Kafka
      # container, so the health check is disabled everywhere else.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
