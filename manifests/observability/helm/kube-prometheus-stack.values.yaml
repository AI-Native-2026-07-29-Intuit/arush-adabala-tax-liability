# Helm values for kube-prometheus-stack (Prometheus Operator + Prometheus + Alertmanager + Grafana).
#
# Installed ONCE per cluster into the `monitoring` namespace - see cluster-bootstrap.md. The
# per-application observability objects (ServiceMonitor, PrometheusRule, AlertmanagerConfig,
# dashboard ConfigMap) all live in git under manifests/observability/ and .grafana/, and are
# applied by scripts/observability-apply.sh; nothing here is app-specific except the datasource
# wiring that makes the trace -> logs pivot work.
prometheus:
  prometheusSpec:
    # Exemplars are how a Duration panel's p99 point carries a trace_id: Prometheus only stores
    # them when this feature flag is on, and there is no error when it is off - the diamonds
    # simply never appear. Needed by Task 3.
    enableFeatures:
      - exemplar-storage
    # The Operator's default selectors are scoped to `release: kube-prometheus-stack`, which is
    # why every object this repo ships carries that label. Left at the default deliberately:
    # dropping the selector would make the Operator pick up any ServiceMonitor in the cluster.
    #
    # ServiceMonitors/PrometheusRules live in the taxcalc-dev namespace, NOT here, so the
    # Operator has to be told to look outside its own release namespace.
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    probeNamespaceSelector: {}
    # k3d nodes have no persistent volumes worth the trouble for a dev cluster; 6h of retention
    # is more than the burn-rate windows (1h fast / 6h slow) need.
    retention: 6h
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { memory: 2Gi }

alertmanager:
  alertmanagerSpec:
    # Same reasoning as the Prometheus selectors above: taxcalc-api-alertmanagerconfig.yaml is
    # applied into taxcalc-dev, so Alertmanager must look beyond the monitoring namespace.
    alertmanagerConfigNamespaceSelector: {}
    alertmanagerConfigSelector:
      matchLabels:
        release: kube-prometheus-stack
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { memory: 256Mi }

grafana:
  # Dev-only credentials for a cluster that is created and destroyed per lab; there is no
  # ingress in front of Grafana, it is reached through `kubectl port-forward`.
  adminPassword: admin
  sidecar:
    dashboards:
      enabled: true
      # This namespace only. `ALL` needs the sidecar to watch ConfigMaps cluster-wide, which
      # the chart's RBAC does not grant here - the sidecar's watch loop dies immediately
      # ("Process for ALL/configmap died"), taking the whole Grafana pod into CrashLoopBackOff
      # with no mention of permissions anywhere in the message. The dashboard ConfigMap is
      # applied into `monitoring` for exactly this reason.
      searchNamespace: monitoring
      label: grafana_dashboard
      # Dashboards land here; the provisioning provider below (allowUiUpdates: false) is what
      # actually disables click-to-edit.
      folder: /tmp/dashboards
      provider:
        name: sidecar-provider
        folder: "Capstone"
        disableDelete: true
        allowUiUpdates: false
  additionalDataSources:
    # Loki + Tempo are separate Helm releases; Grafana needs both as datasources before the
    # trace -> logs pivot exists at all.
    - name: Loki
      type: loki
      # Pinned, not left to Grafana. Without an explicit uid Grafana generates one
      # (P8E80F9AEF21F6940 here), and the Tempo datasource's tracesToLogsV2 block below - which
      # has to name its target datasource by uid - then points at nothing. The "Logs for this
      # span" button silently does not appear, with no error in Grafana or in the datasource
      # config. Same failure family as the ServiceMonitor's release label: valid config,
      # selecting nothing, saying nothing.
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        # Grafana's "Logs for this span" button: take the trace's id and run this Loki query.
        # The log lines carry trace_id as a JSON *field* (not a label), so the filter is a
        # line filter plus a JSON-field matcher rather than a stream selector.
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3100
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          # This mapping is what makes the pivot find anything. Left unset, Grafana builds the
          # stream selector from OpenTelemetry's own convention - {service_name="taxcalc-api"} -
          # and this pipeline deliberately does not ship a `service_name` label: Alloy sends the
          # four labels LABELS.md documents, and Loki's own service_name discovery is off for the
          # same reason. The button then opens a Loki pane reading "No logs found", which looks
          # like missing logs rather than a mismatched label name. Mapping the span's
          # `service.name` resource attribute onto the `app` label produces
          # {app="taxcalc-api"} instead, which is a stream that exists.
          tags:
            - key: "service.name"
              value: "app"
          # Appends the trace id as a LINE filter, which is right: trace_id is a field in the JSON
          # envelope, never a stream label (see LABELS.md). Selector narrows to four labels, then
          # the filter greps.
          filterByTraceID: true
          customQuery: false
        tracesToMetrics:
          datasourceUid: prometheus
        # Exemplars point the other way: Prometheus -> Tempo.
        nodeGraph:
          enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }

# The PrometheusRule admission webhook is left ENABLED (the chart default), even though
# `promtool check rules` in scripts/observability-apply.sh and in CI already rejects malformed
# PromQL earlier and with a better message. Turning it off looks harmless and is not: the same
# certificate the webhook uses also serves the operator's own liveness/readiness endpoint on
# :10250, so `admissionWebhooks.enabled: false` leaves those probes hitting a port with nothing
# listening, and the operator crash-loops on a failed liveness probe with no hint that a webhook
# setting caused it (observed here for real - "Liveness probe failed: dial tcp 10.42.0.16:10250:
# connect: connection refused", exit 137, repeating).
#
# The webhook's cert-generation Job pulls from registry.k8s.io, which is unreachable from inside
# this laptop's cluster; scripts/observability-preload-images.sh imports that image along with
# the rest.

prometheusOperator:
  # The chart's default probes give the operator a 1-second timeout with a failure threshold of
  # 3. That is fine on a real node and wrong on a laptop k3d cluster: under load the operator's
  # TLS handshake on :10250 intermittently takes longer than a second, three of those in a row
  # kill the container (exit 137), and the restart makes the next handshake slower still - a
  # crash loop caused entirely by the probe, with the operator itself perfectly healthy
  # (observed here: "Liveness probe failed: context deadline exceeded", then "connection reset
  # by peer", every couple of minutes).
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 20
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 10
    periodSeconds: 20
    failureThreshold: 6
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { memory: 512Mi }

# Cluster-level exporters, off: this deliverable measures the application (RED from
# http_server_requests, a business counter, a latency SLO), and node/pod-inventory metrics would
# only add two DaemonSet/Deployment workloads and two more image pulls to a laptop cluster.
nodeExporter:     { enabled: false }
kubeStateMetrics: { enabled: false }

# k3d's kubelet/controller-manager/scheduler/etcd are not reachable on the addresses the chart
# defaults to (they run inside the k3s server container), so their scrape jobs fail noisily and
# add nothing to this deliverable.
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
kubeEtcd:              { enabled: false }
kubeProxy:             { enabled: false }
