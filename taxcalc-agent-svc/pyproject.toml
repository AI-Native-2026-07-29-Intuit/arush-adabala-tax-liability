# taxcalc-agent-svc/pyproject.toml
# The W7 D5 capstone: a FastAPI service hosting a three-node LangGraph whose only tool surface is
# the W7 D4 MCP server and whose only retriever is the W7 D3 sidecar. Both arrive as path
# dependencies, for the same reason the MCP server took the sidecar that way - this repository is
# the registry, and a copied module is a second contract to keep in step.
[project]
name = "taxcalc-agent-svc"
version = "0.1.0"
description = "agent-svc: three-node LangGraph (retrieval, api, synthesis) wrapping taxcalc-mcp-server."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.40",
    "instructor>=1.4",
    # Upper-bounded for the same reason the MCP server bounds `mcp`: everything here is written
    # against the v1 ClientSession/sse_client contract that taxcalc-mcp-server publishes.
    "mcp>=1.2,<2",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "langsmith>=0.1.80",
    "structlog>=24.1",
    "tenacity>=8.3",
    # The W7 D3 sidecar + W7 D4 MCP server as path deps (read-only library reuse):
    "taxcalc-ai",
    "taxcalc-mcp-server",
]

[project.scripts]
taxcalc-agent-svc = "taxcalc_agent_svc.app:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    "testcontainers[postgres]>=4.7",
    # RAGAS is a DEV dependency, not a runtime one, and that placement is the claim that the
    # eval gate scores the service from outside rather than being wired into a request path.
    # It also keeps its heavyweight transitive graph (datasets, a second LLM client) out of the
    # production image, which is what the Dockerfile's `--no-dev` install relies on.
    "ragas>=0.2",
]

[tool.uv]
package = true

[tool.uv.sources]
taxcalc-ai = { path = "../taxcalc-ai", editable = true }
taxcalc-mcp-server = { path = "../taxcalc-mcp-server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxcalc_agent_svc"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
exclude = ["build/", "dist/"]

# langgraph ships py.typed but its `StateGraph.compile()` returns a Pregel whose `invoke` and
# `astream_events` are typed against `Any`; the checkpointer's `from_conn_string` is a context
# manager over an untyped alias. Scoped to langgraph alone rather than loosened globally.
[[tool.mypy.overrides]]
module = ["langgraph.*"]
follow_untyped_imports = true

# Same reason as the MCP server: @traceable is an untyped decorator built through **kwargs, so
# --strict reports every traced node as "untyped decorator". One scoped override beats a
# `# type: ignore` on each of the five traced callables.
[[tool.mypy.overrides]]
module = ["langsmith.*", "ragas.*", "instructor.*", "mcp.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "RUF", "T20", "SLF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "SLF001", "S603", "S607"]
# The eval entrypoints are operator/CI surfaces: they report a verdict on stdout and exit with a
# status code. A gate whose output only reached a log handler would be invisible in the Actions
# UI, which is the one place anyone reads it.
"src/taxcalc_agent_svc/scripts/*.py" = ["T20"]
"evals/*.py" = ["T20"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "e2e: spins Docker containers via Testcontainers; runs on the merge-to-main CI tier only",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
