plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot'      version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.5'
}

group   = 'com.uptimecrew.tax_liability'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Pin the Spring Cloud release train (compatible with Spring Boot 3.3 / Java 21).
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
    }
}

dependencies {
    // --- Spring Boot (NEW for W2 D3) ---------------------------------------
    implementation      'org.springframework.boot:spring-boot-starter'
    implementation      'org.springframework.boot:spring-boot-starter-web'
    implementation      'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly         'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly         'org.postgresql:postgresql:42.7.3'

    // --- Spring Data JPA (NEW for W2 D4) -----------------------------------
    implementation      'org.springframework.boot:spring-boot-starter-data-jpa'

    // --- Spring Data MongoDB + Redis + Cache abstraction (NEW for W2 D5) ---
    implementation      'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation      'org.springframework.boot:spring-boot-starter-data-redis'
    implementation      'org.springframework.boot:spring-boot-starter-cache'

    // --- Spring Security 7, Resource Server JWT & Bucket4j rate limiting (NEW for W3 D1) ---
    implementation      'org.springframework.boot:spring-boot-starter-security'
    implementation      'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation      'com.bucket4j:bucket4j-core:8.10.1'
    implementation      'com.bucket4j:bucket4j-redis:8.10.1'      // reuses the W2 D5 Redis as the distributed bucket store
    testImplementation  'org.springframework.security:spring-security-test'

    // --- springdoc-openapi, OpenFeign & Resilience4j (NEW for W3 D2) ------
    implementation      'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation      'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation      'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    testImplementation  'org.wiremock:wiremock-standalone:3.9.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.10.0'

    implementation      'org.slf4j:slf4j-api:2.0.12'
    runtimeOnly         'ch.qos.logback:logback-classic:1.5.6'
    testImplementation  'ch.qos.logback:logback-classic:1.5.6'
    testImplementation  'org.assertj:assertj-core:3.25.3'

    testImplementation platform('org.testcontainers:testcontainers-bom:1.19.7')
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.postgresql:postgresql:42.7.3'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // --- NEW for W2 D5: Testcontainers MongoDB module -----------------------
    // Redis test uses the core GenericContainer with the redis:7-alpine image -
    // no extra Testcontainers module needed for simple use.
    testImplementation 'org.testcontainers:mongodb'

    // --- Spring Boot test starter (NEW for W2 D3) --------------------------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
