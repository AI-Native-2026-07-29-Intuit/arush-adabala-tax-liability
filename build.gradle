buildscript {
    dependencies {
        // Flyway 10+ split per-database support out of flyway-core; the Gradle plugin's CLI
        // tasks (flywayMigrate, flywayInfo, ...) need this on the *buildscript* classpath
        // (separate from the app's own runtime classpath) to talk to Postgres at all.
        classpath 'org.flywaydb:flyway-database-postgresql:11.19.1'
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot'      version '3.3.13'
    id 'io.spring.dependency-management' version '1.1.5'
    // A newer release than the flyway-core version Spring Boot 3.3.2 manages below
    // (10.10.0): the Gradle plugin needs a version compatible with this project's
    // Gradle 9.6.1 (10.10.0 references JavaPluginConvention, removed in Gradle 9).
    // The plugin's own bundled Flyway only drives the CLI tasks (flywayMigrate,
    // flywayInfo, ...) - the app itself always runs the Boot-managed 10.10.0 at runtime.
    id 'org.flywaydb.flyway'           version '11.19.1'
}

group   = 'com.uptimecrew.tax_liability'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// The W5 D4 serverless slice (com.uptimecrew.tax_liability.lambda) is built by pom.xml, not by
// Gradle: it is packaged as a shaded jar for the AWS Lambda java21 runtime and its dependency
// closure (aws-lambda-java-events + the DynamoDB SDK, no Spring at all) has nothing in common
// with this application's. Leaving it in Gradle's source sets would only mean adding the whole
// AWS SDK to the Boot application's classpath - and to its Docker image - to compile code the
// application never loads. Excluded from `test` too, so the JaCoCo branch-coverage floor keeps
// measuring the service, not a handler Maven already tests.
sourceSets {
    main {
        java {
            exclude 'com/uptimecrew/tax_liability/lambda/**'
        }
    }
    test {
        java {
            exclude 'com/uptimecrew/tax_liability/lambda/**'
        }
    }
}

// Trivy (docker/SECURITY.md scan) flagged HIGH/CRITICAL CVEs against the Tomcat and Netty
// versions Spring Boot 3.3.13's BOM manages by default. Both projects publish patch releases
// within their existing 3.3-compatible lines (10.1.x, 4.1.x respectively), so Spring Boot's
// documented ext[] override mechanism can pull the fix in without changing the BOM/plugin
// version itself. See docker/SECURITY.md for the CVE IDs this closes.
// 10.1.55 -> 10.1.59 on 2026-09-04. Three CRITICAL, already-FIXED CVEs landed against
// tomcat-embed-core 10.1.55 after the 2026-08-27 waiver was written, so `ignore-unfixed: true`
// does not hide them and no .trivyignore entry covers them: CVE-2026-65182 (security
// constraint bypass), CVE-2026-65905 (authentication bypass) and CVE-2026-68525 (unauthorized
// access). Waiving an authentication bypass that has a drop-in patch available would be the
// wrong call, and 10.1.x is inside Spring Boot 3.3's line - exactly what this block is for.
//
// NOTE the version is 10.1.59, not the 10.1.58 Trivy names as the fix: 10.1.58 was never
// published to Maven Central (the 10.1.x metadata goes ...56, 57, 59, and a direct fetch of
// 10.1.58 is a 404, so Gradle resolves it as FAILED). 10.1.59 supersedes it and carries the
// same fixes. Do not "correct" this to 10.1.58 to match the advisory - it will not resolve.
ext['tomcat.version'] = '10.1.59'
ext['netty.version'] = '4.1.136.Final'
ext['jackson-bom.version'] = '2.18.8'

// Pin the Spring Cloud release train (compatible with Spring Boot 3.3 / Java 21).
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
        // spring-cloud-dependencies pins io.opentelemetry:* to 1.37.0 (for its own Micrometer
        // Tracing bridge), which is missing io.opentelemetry.api.internal.InstrumentationUtil -
        // a class the 2.10.0 instrumentation modules (NEW for W3 D5) call at JDBC-wrap time,
        // throwing NoClassDefFoundError. A dependencyManagement entry declared directly in this
        // project overrides one pulled in transitively via an imported BOM, so this re-pins the
        // whole io.opentelemetry:* family to the version the instrumentation modules actually want.
        mavenBom 'io.opentelemetry:opentelemetry-bom:1.44.1'
    }
}

// CLI-only (flywayMigrate, flywayInfo, ...): the app itself applies migrations on startup
// via spring.flyway.* in application.yml, using whatever datasource Spring Boot wires up
// (including the Testcontainers one @ServiceConnection substitutes in tests). This block
// targets the same local dev Postgres application.yml's "local" profile points at, for
// running/inspecting migrations without starting the app.
flyway {
    url = 'jdbc:postgresql://localhost:5432/postgres'
    user = 'postgres'
    password = System.getenv('DB_PASSWORD') ?: 'devpass'
    locations = ['filesystem:src/main/resources/db/migration']
}

dependencies {
    // --- Spring Boot (NEW for W2 D3) ---------------------------------------
    implementation      'org.springframework.boot:spring-boot-starter'
    implementation      'org.springframework.boot:spring-boot-starter-web'
    implementation      'org.springframework.boot:spring-boot-starter-actuator'
    // developmentOnly: excluded from bootJar by the Spring Boot Gradle plugin, so it never
    // reaches the shipped Docker image. Powers the compose.override.yaml live-reload loop
    // (see scripts/dev.md) - NEW for W5 D2.
    developmentOnly     'org.springframework.boot:spring-boot-devtools'
    runtimeOnly         'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly         'org.postgresql:postgresql:42.7.11'

    // --- Flyway migrations (NEW for W3 D3): owns taxcalc DDL, Hibernate stays ddl-auto=validate ---
    implementation      'org.flywaydb:flyway-core'
    implementation      'org.flywaydb:flyway-database-postgresql'

    // --- Spring Data JPA (NEW for W2 D4) -----------------------------------
    implementation      'org.springframework.boot:spring-boot-starter-data-jpa'

    // --- Spring Data MongoDB + Redis + Cache abstraction (NEW for W2 D5) ---
    implementation      'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation      'org.springframework.boot:spring-boot-starter-data-redis'
    implementation      'org.springframework.boot:spring-boot-starter-cache'

    // --- Spring Security 7, Resource Server JWT & Bucket4j rate limiting (NEW for W3 D1) ---
    implementation      'org.springframework.boot:spring-boot-starter-security'
    implementation      'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation      'com.bucket4j:bucket4j-core:8.10.1'
    implementation      'com.bucket4j:bucket4j-redis:8.10.1'      // reuses the W2 D5 Redis as the distributed bucket store
    testImplementation  'org.springframework.security:spring-security-test'

    // --- springdoc-openapi, OpenFeign & Resilience4j (NEW for W3 D2) ------
    implementation      'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    // spring-cloud-starter transitively pulls spring-security-rsa -> bcprov-jdk18on (~8MB): a
    // BouncyCastle provider for decrypting {cipher}-prefixed config properties and PEM-encoded
    // RSA keys. This project uses neither (no {cipher} values, no PEM key paths anywhere in
    // config) - excluded to keep it off the Docker runtime image.
    implementation('org.springframework.cloud:spring-cloud-starter-openfeign') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation('org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }

    testImplementation  'org.wiremock:wiremock-standalone:3.9.1'

    // --- Kafka outbox/consumer (NEW for W3 D3) -----------------------------
    // zstd-jni (~6.4MB) bundles native compression binaries for every platform kafka-clients
    // might run on; it is only loaded if compression.type=zstd is configured, which this
    // project never sets (producer/consumer use Kafka's default "none"). Excluded to keep it
    // off the Docker runtime image.
    implementation('org.springframework.kafka:spring-kafka') {
        exclude group: 'com.github.luben', module: 'zstd-jni'
    }

    // --- Spring AI MCP server (NEW for W3 D3) -------------------------------
    // Spring Boot 3.3 does not manage Spring AI's version - it is not in the Boot BOM - so this
    // starter is pinned explicitly to the last 1.0.x GA release compatible with Boot 3.3
    // (the 1.0.0-M5 milestone this curriculum step references has since been removed from
    // the milestone repo now that Spring AI has shipped a stable 1.0 line).
    implementation      'org.springframework.ai:spring-ai-starter-mcp-server-webmvc:1.0.0'

    testImplementation  'org.springframework.kafka:spring-kafka-test'
    testImplementation  'org.awaitility:awaitility:4.2.2'

    // --- Spring for GraphQL (NEW for W3 D4) --------------------------------
    implementation      'org.springframework.boot:spring-boot-starter-graphql'
    implementation      'org.springframework.boot:spring-boot-starter-webflux'   // GraphiQL UI uses reactive routing under the hood; the rest of the service stays on Spring MVC
    testImplementation  'org.springframework.graphql:spring-graphql-test'

    // --- Spring AI Anthropic chat model + JSON Schema re-validation (NEW for W3 D4 Task 3) ---
    // Same pin rationale as the MCP starter above: Spring AI isn't in the Boot 3.3 BOM, so this
    // is pinned to the same 1.0.x GA release line.
    implementation      'org.springframework.ai:spring-ai-starter-model-anthropic:1.0.0'
    implementation      'com.networknt:json-schema-validator:1.5.1'   // needed at RUNTIME, not just test - LlmSummaryService validates LLM output against a hand-written schema

    // --- OpenTelemetry auto-instrumentation + manual spans (NEW for W3 D5) -------------------
    // Import the instrumentation BOM as a platform so every OTel artifact below (including the
    // OTel SDK/API those artifacts pull in transitively) resolves to the exact mutually-compatible
    // version set for this 2.10.0 instrumentation release line, rather than each artifact's own
    // "latest compatible" guess - hand-pinning io.opentelemetry:* artifacts to a version off that
    // line (e.g. a newer opentelemetry-api) causes a NoClassDefFoundError at JDBC-instrumentation
    // wrap time, since the instrumentation jars are compiled against the BOM's pinned API version.
    implementation      platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.10.0')
    testImplementation  platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.10.0')
    // opentelemetry-spring-boot-starter wires the OTel SDK + autoconfiguration for the OTLP
    // exporter, and pulls in instrumentation modules for the Spring MVC server, JDBC, and the
    // Apache HTTP client. opentelemetry-exporter-otlp ships the protobuf encoder; the starter
    // selects HTTP/protobuf or gRPC via the otel.exporter.otlp.protocol property (application.yml).
    implementation      'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation      'io.opentelemetry:opentelemetry-exporter-otlp'
    // The spring-kafka instrumentation is the -alpha artifact for the 2.7 contract and is NOT
    // included in the boot starter - Kafka is the most common trace-continuity break.
    implementation      'io.opentelemetry.instrumentation:opentelemetry-spring-kafka-2.7:2.10.0-alpha'
    implementation      'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations'

    testImplementation  'io.opentelemetry:opentelemetry-sdk-testing'

    // --- Micrometer Prometheus exposition + JSON logs (NEW for W5 D5) -----------------------
    // spring-boot-starter-actuator has been on the classpath since W2 D3; adding the Prometheus
    // registry is what makes Boot autoconfigure a PrometheusMeterRegistry and serve the text
    // exposition format at /actuator/prometheus (the endpoint still has to be listed in
    // management.endpoints.web.exposure.include - see application.yml).
    implementation      'io.micrometer:micrometer-registry-prometheus'
    // runtimeOnly, not implementation: no Java source references LogstashEncoder - only
    // logback-spring.xml's prod/k8s profile names it, and Logback resolves appenders/encoders
    // reflectively at configuration time. It still ships in bootJar (runtimeOnly is part of
    // runtimeClasspath) and on the test runtime classpath, so the k8s logging profile works in
    // the container and in tests alike.
    runtimeOnly         'net.logstash.logback:logstash-logback-encoder:7.4'
    testRuntimeOnly     'net.logstash.logback:logstash-logback-encoder:7.4'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.10.0'

    implementation      'org.slf4j:slf4j-api:2.0.12'
    runtimeOnly         'ch.qos.logback:logback-classic:1.5.18'
    testImplementation  'ch.qos.logback:logback-classic:1.5.18'
    testImplementation  'org.assertj:assertj-core:3.25.3'

    testImplementation platform('org.testcontainers:testcontainers-bom:1.19.7')
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.postgresql:postgresql:42.7.11'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // --- NEW for W2 D5: Testcontainers MongoDB module -----------------------
    // Redis test uses the core GenericContainer with the redis:7-alpine image -
    // no extra Testcontainers module needed for simple use.
    testImplementation 'org.testcontainers:mongodb'

    // --- Spring Boot test starter (NEW for W2 D3) --------------------------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
