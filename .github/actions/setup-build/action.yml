# .github/actions/setup-build/action.yml
# Composite action: JDK + Gradle cache restore. Used by every job that
# compiles this app's Java (ci.yml's build-test, and the reusable
# _build-and-push.yml) - one place to bump the JDK version or cache key
# instead of two near-identical copies drifting apart.
#
# Deliberately does NOT include actions/checkout, even though the lesson
# spec for this deliverable describes the bundle as "checkout + setup-java +
# gradle cache". Verified live: a job's FIRST step cannot be `uses: ./local-
# action`, because the runner has to read this file (action.yml) off disk to
# know what the action even does - which requires the repo to already be
# checked out. Putting checkout inside the composite action is circular for
# that first invocation (confirmed by a real CI failure: "Can't find
# 'action.yml' ... Did you forget to run actions/checkout before running
# your local action?", from a run where this action's own first step WAS
# actions/checkout). Every caller must checkout before its `uses: ./.github/
# actions/setup-build` step; this action starts from JDK setup.
#
# JDK 17, not the 21 this deliverable's reference spec names. build.gradle
# pins java.toolchain.languageVersion=17, and settings.gradle configures no
# toolchain resolver (no foojay plugin, verified), so Gradle cannot download
# a JDK 17 itself - one has to already be installed and discoverable on the
# runner or the build fails with "No matching toolchains found". Installing
# only 21 here would leave the build depending on the runner image happening
# to pre-install a 17 as well: it might work today and break silently on an
# image bump, which is precisely the kind of implicit dependency a pinned
# CI setup exists to remove. Same constraint docker/SECURITY.md documents
# for the Dockerfile's own `builder` stage (eclipse-temurin:17-jdk-jammy).
#
# No taxcalc-api/ subdirectory: this repo's build.gradle/gradlew/src/ already
# live at the repo root (see docker/SECURITY.md's "Known deviations" table),
# so there is no working-directory to set here, unlike a multi-module layout.
name: setup-build
description: Install Temurin 17 and restore the Gradle dependency cache (caller must checkout first).

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
