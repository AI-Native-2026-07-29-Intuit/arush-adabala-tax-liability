# .github/workflows/k8s-ci.yml - kubeconform + k3d + apply + rollout + smoke (W5 D3).
name: taxcalc-api k8s-ci

on:
  pull_request:
    paths:
      - 'manifests/**'
      - 'scripts/k8s-*.sh'
      # This job builds the image from source, so the sources that go into it
      # have to be triggers too. (The reference workflow listed 'taxcalc-api/**'
      # for a repo whose Gradle module sits in a subdirectory; here the module
      # is the repo root, so that pattern matched nothing at all.)
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/k8s-ci.yml'

permissions:
  contents: read

jobs:
  manifests-validate-and-deploy:
    runs-on: ubuntu-22.04
    # Headroom over the inner budgets (8m rollout + 3m ingress wait + image
    # build): a deliberately-failed run measured 12m37s end to end, which left
    # almost nothing under the previous 15m cap - and hitting the JOB timeout
    # kills the run before the rollout timeout can produce a clean failure and
    # its diagnostics artifact.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ----- 1. Static validation (no cluster yet) ------------------------
      - name: Install kubeconform
        run: |
          curl -sSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      # W5 D5 added manifests/observability/, which this recursive validation also walks. Three
      # extra flags are needed and each corresponds to a real thing in that tree:
      #   - the CRD catalog, because ServiceMonitor / PrometheusRule / AlertmanagerConfig schemas
      #     ship with the Prometheus Operator rather than with Kubernetes, and -strict rejects
      #     them as unknown kinds without it;
      #   - the Helm values files, which are not Kubernetes objects at all ("missing 'kind' key");
      #   - the Deployment patch, a strategic-merge FRAGMENT with no selector by design, which
      #     fails Deployment schema validation exactly as it should if you treat it as an object.
      - name: kubeconform manifests/
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-filename-pattern 'manifests/observability/helm/.*' \
            -ignore-filename-pattern '.*-deployment-patch.yaml' \
            manifests/

      # ----- 2. Spin up k3d ------------------------------------------------
      - uses: docker/setup-buildx-action@v3

      - name: Build taxcalc-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uptimecrew/taxcalc-api:${{ github.sha }}

      - name: Spin up k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: taxcalc-ci
          # Pinned: the action's own default (v5.4.6) 404s on install - that
          # release's asset naming no longer matches upstream k3d-io/k3d's
          # install script (confirmed via a real failed CI run on this branch).
          k3d-version: v5.9.0
          args: --servers 1 --agents 2 --port "8080:80@loadbalancer" --k3s-arg "--disable=traefik@server:0"

      - name: Deploy ingress-nginx
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/baremetal/deploy.yaml \
            -o ingress-nginx-baremetal.yaml
          # k3d's `--port "8080:80@loadbalancer"` forwards the host port to
          # port 80 on the cluster's nodes - it's a static node-IP:port proxy,
          # not Service-aware. The controller only receives that traffic if
          # it's actually bound to the node's own port 80, which the upstream
          # manifest doesn't do by default (its Service is ClusterIP-routed,
          # not host-bound) - confirmed via a real failed CI run where every
          # smoke request got curl exit 52 "Empty reply from server" on every
          # retry, not a one-off race. `hostNetwork: true` fixes it.
          sed -i 's/^      dnsPolicy: ClusterFirst$/      dnsPolicy: ClusterFirstWithHostNet\n      hostNetwork: true/' \
            ingress-nginx-baremetal.yaml
          kubectl apply -f ingress-nginx-baremetal.yaml
          # The upstream manifest's ValidatingWebhookConfiguration requires its
          # own cert-gen Jobs to finish AND the controller's webhook port to be
          # reachable before the admission Service has endpoints - until then
          # every `kubectl apply` of an Ingress object 500s against it. Not
          # needed for this lab (nothing here relies on Ingress admission
          # validation), so it's dropped rather than raced against.
          kubectl delete validatingwebhookconfiguration ingress-nginx-admission --ignore-not-found
          kubectl -n ingress-nginx wait --for=condition=available --timeout=180s deploy/ingress-nginx-controller

      - name: Import image into the cluster
        # `k3d image import` has a real reliability gap in this environment:
        # it writes the image to a shared volume, then execs into every node
        # to load it from there - and on a cold multi-node cluster the exec
        # can race the volume write, failing with "no such file or
        # directory" on EVERY node while k3d still prints "Successfully
        # imported image(s)" and exits 0 (confirmed via a real failed CI run:
        # the misleading success message, then every taxcalc-api pod stuck
        # in ImagePullBackOff because the image was never actually there).
        # Retry, and verify the digest actually landed in each node's
        # containerd store rather than trusting k3d's own exit code.
        run: |
          IMAGE="uptimecrew/taxcalc-api:${{ github.sha }}"
          # Node names are discovered, not hardcoded - a hardcoded list silently
          # goes stale the moment the cluster's --agents count changes.
          NODES=$(k3d node list --no-headers \
            | awk '$1 ~ /^k3d-taxcalc-ci-/ && $2 != "loadbalancer" { print $1 }')
          echo "Verifying against nodes: ${NODES}"
          for attempt in 1 2 3; do
            echo "Import attempt ${attempt}..."
            k3d image import "${IMAGE}" -c taxcalc-ci || true
            missing=0
            for node in ${NODES}; do
              docker exec "${node}" crictl inspecti "${IMAGE}" >/dev/null 2>&1 || missing=1
            done
            if [ "${missing}" -eq 0 ]; then
              echo "Image present on every node."
              exit 0
            fi
            echo "Import incomplete, retrying in 5s..."
            sleep 5
          done
          echo "::error::${IMAGE} missing from at least one node after 3 import attempts"
          exit 1

      - name: Patch image tag in Deployment manifest
        run: |
          sed -i "s|uptimecrew/taxcalc-api:[^\"[:space:]]*|uptimecrew/taxcalc-api:${{ github.sha }}|" \
            manifests/10-taxcalc-api.deployment.yaml

      - name: Seed Secret from CI value (NOT from the committed placeholder)
        run: |
          kubectl create namespace taxcalc-dev || true
          kubectl create secret generic taxcalc-api-secrets \
            -n taxcalc-dev \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$CI_PG_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          CI_PG_PASSWORD: ${{ secrets.CI_PG_PASSWORD }}

      - name: Compute config/secret checksums into the Deployment's pod template
        # A ConfigMap/Secret content change alone doesn't trigger a rollout -
        # Kubernetes only restarts pods when the *pod template* changes, so
        # these two annotations exist purely to give the template something
        # that changes in lockstep with the data it reads via envFrom.
        #
        # Both values are the live object's metadata.resourceVersion, which the
        # API server bumps on every write that actually changes the object and
        # leaves alone on a no-op re-apply - exactly the "changes iff the data
        # changed" property this needs. Deliberately NOT a hash of the secret
        # material: an earlier revision used sha256($CI_PG_PASSWORD), which
        # writes an unsalted, offline-crackable verifier for the real DB
        # password into an annotation readable by anyone who can
        # `get deployment` (far broader RBAC than `get secret`). Hashing
        # `.data` would be no better - that payload is only base64, not
        # encryption. resourceVersion leaks nothing about the value at all.
        # It also fixes an accuracy bug in the previous file-hash approach,
        # which hashed the manifest's comments too and so forced a pointless
        # rollout on any comment-only edit.
        #
        # The ConfigMap has to exist before it can be read, so it's applied
        # here (idempotently; the full `kubectl apply -f manifests/` follows).
        run: |
          kubectl apply -f manifests/30-taxcalc-api.configmap.yaml
          CONFIG_HASH=$(kubectl get configmap taxcalc-api-config -n taxcalc-dev \
            -o jsonpath='{.metadata.resourceVersion}')
          SECRET_HASH=$(kubectl get secret taxcalc-api-secrets -n taxcalc-dev \
            -o jsonpath='{.metadata.resourceVersion}')
          sed -i "s|checksum/config: \".*\"|checksum/config: \"${CONFIG_HASH}\"|" \
            manifests/10-taxcalc-api.deployment.yaml
          sed -i "s|checksum/secret: \".*\"|checksum/secret: \"${SECRET_HASH}\"|" \
            manifests/10-taxcalc-api.deployment.yaml

      # ----- 3. Server-side admission + apply -------------------------------
      - name: Server-side dry-run
        run: kubectl apply -f manifests/ --dry-run=server

      - name: Apply
        run: kubectl apply -f manifests/

      - name: Wait for rollout (gates the build)
        run: |
          kubectl rollout status \
            deploy/taxcalc-api -n taxcalc-dev --timeout=8m

      # ----- 4. Smoke -------------------------------------------------------
      - name: Smoke test through the Ingress
        run: ./scripts/k8s-smoke.sh

      # ----- 5. Diagnostics on failure ---------------------------------------
      - name: Capture diagnostics on failure
        if: failure()
        # `|| true` on EVERY command, not just the last: the step runs under
        # `bash -e`, so when the cluster never came up the first kubectl call
        # aborted the whole step before anything was written - observed for real
        # (run 33467921042: step failed, and the upload warned "No files were
        # found with the provided path: pod-logs.txt").
        #
        # Everything is tee'd into files as well as stdout, so the artifact
        # actually contains the `describe` output too - previously `get all` and
        # `describe` went to the job log only and the artifact held nothing but
        # pod logs.
        run: |
          mkdir -p k8s-diagnostics
          kubectl get all -n taxcalc-dev \
            2>&1 | tee k8s-diagnostics/get-all.txt || true
          kubectl describe deploy/taxcalc-api -n taxcalc-dev \
            2>&1 | tee k8s-diagnostics/describe-deploy.txt || true
          kubectl describe pod -l app.kubernetes.io/name=taxcalc-api -n taxcalc-dev \
            2>&1 | tee k8s-diagnostics/describe-pods.txt || true
          kubectl get events -n taxcalc-dev --sort-by=.lastTimestamp \
            2>&1 | tee k8s-diagnostics/events.txt || true
          kubectl logs deploy/taxcalc-api -n taxcalc-dev --tail=200 \
            2>&1 | tee k8s-diagnostics/pod-logs.txt || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: k8s-diagnostics
          path: k8s-diagnostics/
          retention-days: 14
          if-no-files-found: warn
