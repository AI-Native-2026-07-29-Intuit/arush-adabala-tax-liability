# .github/workflows/web-ci.yml
name: taxcalc-web CI

on:
  pull_request:
    paths:
      - 'taxcalc-web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: taxcalc-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'taxcalc-web/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm build
