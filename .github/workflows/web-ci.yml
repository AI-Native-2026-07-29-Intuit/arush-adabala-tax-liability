# .github/workflows/web-ci.yml
name: taxcalc-web CI

on:
  pull_request:
    paths:
      - 'taxcalc-web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: taxcalc-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # This commit carries THREE tags: v4.4.0, v5.0.0 and the moving v5. The
      # comment names v5.0.0 because that is what Dependabot resolves it to (see
      # PR #41, "from 5.0.0"), so the label and the tooling agree. Note the
      # moving `v4` tag points at a DIFFERENT commit (b906affc), so this pin is
      # not what `@v4` resolved to - the one action in this repo where pinning
      # changed the executed bytes. Verified green on web-ci run 33846843137.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'taxcalc-web/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm build
