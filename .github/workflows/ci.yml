# .github/workflows/ci.yml
# The required PR gate: compile + the full JUnit 5 suite (unit + the
# Testcontainers-backed integration tests) + the JaCoCo 70% branch-coverage
# floor, via `./gradlew build` (build.gradle wires `check.dependsOn
# jacocoTestCoverageVerification`, so `build` already runs everything this
# job needs - no separate `test`/`jacocoTestReport` invocation required).
name: taxcalc-api ci

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

# PR force-pushes cancel their own stale run; a main push queue serialises
# instead (a half-finished push-to-main build/push must never be cancelled
# mid-way by the next commit landing seconds later).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Top-level default: read-only. Individual jobs widen only what they need
# (call-build-and-push adds packages: write for GHCR and id-token: write for
# OIDC - and, being the caller of a reusable workflow, grants them on behalf
# of that workflow's job too).
permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (taxcalc-api)
    # The spec's literal runner. This job could NOT use it until 2026-09-04:
    # the org hit an Actions spending-limit block in W5 D2 and GitHub-hosted
    # runners would not start at all ("The job was not started because recent
    # account payments have failed"), which is why every workflow here moved
    # to Blacksmith - a fix, not a preference. Public repositories get free
    # standard GitHub-hosted runners, so making this repo public lifted that
    # block. Measured before changing it, not assumed: a throwaway
    # ubuntu-24.04 job booted on a Hosted Compute Agent and passed (run
    # 33851940650), so the constraint is genuinely gone rather than merely
    # believed to be.
    #
    # The other workflows deliberately STAY on Blacksmith, which is now a
    # choice rather than a constraint: observability.yml's cluster job runs
    # 5m23s there against 13m52s on a GitHub-hosted runner. This job is the
    # one the deliverable pins by name, and it is the required status check
    # on main, so it matches the spec exactly.
    runs-on: ubuntu-24.04
    # 15 per the deliverable spec. Measured headroom, not a guess: the first
    # cold-cache run of this suite - which boots real Testcontainers-backed
    # Postgres/Mongo/Redis/Kafka across ~35 @SpringBootTest/@DataJpaTest/
    # @DataMongoTest classes - took 4m54s, and a warm one 5m38s, so 15 leaves
    # roughly 3x. Raise it (and say why here) if a real run ever approaches it.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Must precede the composite action rather than live inside it - see
      # .github/actions/setup-build/action.yml's header for the CI failure
      # that proved it. No `fetch-depth:` - 1 is already actions/checkout's
      # default, and every other workflow in this repo calls it bare too.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build env (composite)
        uses: ./.github/actions/setup-build

      - name: Gradle build (compile + full test suite + JaCoCo gate)
        run: ./gradlew --no-daemon build

      - name: Upload test + coverage reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taxcalc-api-test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7

  # Only on push to main, and only once build-test is green: build the
  # image, Trivy-scan it, and push to ECR via OIDC. A PR run never reaches
  # this job - docker.yml already covers PR-time build+scan+smoke (no
  # push), a separate gate from W5 D1 left untouched by this deliverable.
  call-build-and-push:
    name: Build, scan & push (dev)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build-and-push.yml
    with:
      app-name: taxcalc-api
      image-name: uptimecrew/taxcalc-api
      ecr-repo: uptimecrew/taxcalc-api
    # The ONLY place these are granted. A reusable workflow's job runs with the
    # CALLING job's token, so _build-and-push.yml deliberately carries no
    # `permissions:` block of its own (see its comment). contents: read to
    # check out, packages: write to push to GHCR, id-token: write to mint the
    # OIDC token for AWS STS. Adding a registry means widening this block.
    permissions:
      contents: read
      packages: write
      id-token: write
