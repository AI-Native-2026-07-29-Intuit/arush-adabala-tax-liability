# .github/workflows/ci.yml
# The required PR gate: compile + the full JUnit 5 suite (unit + the
# Testcontainers-backed integration tests) + the JaCoCo 70% branch-coverage
# floor, via `./gradlew build` (build.gradle wires `check.dependsOn
# jacocoTestCoverageVerification`, so `build` already runs everything this
# job needs - no separate `test`/`jacocoTestReport` invocation required).
name: taxcalc-api ci

on:
  # DELIBERATELY UNFILTERED on pull_request, unlike the push trigger below.
  #
  # `Build + test (taxcalc-api)` is a REQUIRED status check on main. A required
  # check that is path-filtered is a trap: GitHub waits forever for a context
  # that will never report, so any PR touching none of the paths below can
  # never merge - not "runs without the check", but permanently blocked with no
  # way to override short of an admin bypass or editing the rule.
  #
  # That is not hypothetical here. It stranded four Dependabot PRs (#39-#42)
  # the moment branch protection was created: each touches only .github/
  # workflow files, so ci.yml never triggered, the required context never
  # reported, and all four were unmergeable. Every future docs-only or
  # workflow-only PR would have hit the same wall.
  #
  # The cost is real and accepted: every PR now runs the full Testcontainers
  # suite, including documentation-only ones. The alternative - a twin workflow
  # publishing the same check name on `paths-ignore` - fires BOTH workflows for
  # a PR touching matched and unmatched files at once, producing two check runs
  # with one name. It works, but it is the kind of clever that breaks quietly.
  # A required check should be unconditional; that is what makes it a gate.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

# PR force-pushes cancel their own stale run; a main push queue serialises
# instead (a half-finished push-to-main build/push must never be cancelled
# mid-way by the next commit landing seconds later).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Top-level default: read-only. Individual jobs widen only what they need
# (call-build-and-push adds packages: write for GHCR and id-token: write for
# OIDC - and, being the caller of a reusable workflow, grants them on behalf
# of that workflow's job too).
permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (taxcalc-api)
    # The spec's literal runner. This job could NOT use it until 2026-09-04:
    # the org hit an Actions spending-limit block in W5 D2 and GitHub-hosted
    # runners would not start at all ("The job was not started because recent
    # account payments have failed"), which is why every workflow here moved
    # to Blacksmith - a fix, not a preference. Public repositories get free
    # standard GitHub-hosted runners, so making this repo public lifted that
    # block. Measured before changing it, not assumed: a throwaway
    # ubuntu-24.04 job booted on a Hosted Compute Agent and passed (run
    # 33851940650), so the constraint is genuinely gone rather than merely
    # believed to be.
    #
    # The other workflows deliberately STAY on Blacksmith, which is now a
    # choice rather than a constraint: observability.yml's cluster job runs
    # 5m23s there against 13m52s on a GitHub-hosted runner. This job is the
    # one the deliverable pins by name, and it is the required status check
    # on main, so it matches the spec exactly.
    runs-on: blacksmith-2vcpu-ubuntu-2204
    # 15 per the deliverable spec. Measured headroom, not a guess: the first
    # cold-cache run of this suite - which boots real Testcontainers-backed
    # Postgres/Mongo/Redis/Kafka across ~35 @SpringBootTest/@DataJpaTest/
    # @DataMongoTest classes - took 4m54s, and a warm one 5m38s, so 15 leaves
    # roughly 3x. Raise it (and say why here) if a real run ever approaches it.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Must precede the composite action rather than live inside it - see
      # .github/actions/setup-build/action.yml's header for the CI failure
      # that proved it. No `fetch-depth:` - 1 is already actions/checkout's
      # default, and every other workflow in this repo calls it bare too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build env (composite)
        uses: ./.github/actions/setup-build

      - name: Gradle build (compile + full test suite + JaCoCo gate)
        run: ./gradlew --no-daemon build

      - name: Upload test + coverage reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taxcalc-api-test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7

  # Only on push to main, and only once build-test is green: build the
  # image, Trivy-scan it, and push to ECR via OIDC. A PR run never reaches
  # this job - docker.yml already covers PR-time build+scan+smoke (no
  # push), a separate gate from W5 D1 left untouched by this deliverable.
  call-build-and-push:
    name: Build, scan & push (dev)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build-and-push.yml
    with:
      app-name: taxcalc-api
      image-name: uptimecrew/taxcalc-api
      ecr-repo: uptimecrew/taxcalc-api
    # The ONLY place these are granted. A reusable workflow's job runs with the
    # CALLING job's token, so _build-and-push.yml deliberately carries no
    # `permissions:` block of its own (see its comment). contents: read to
    # check out, packages: write to push to GHCR, id-token: write to mint the
    # OIDC token for AWS STS. Adding a registry means widening this block.
    permissions:
      contents: read
      packages: write
      id-token: write

  # W6 D2: the GitOps half. Once the image for this SHA exists in a registry,
  # open a PR against the sibling config repo bumping the dev overlay's image
  # tag. Merging that PR is what deploys; Argo CD, which lives inside the
  # cluster, notices on its next poll and converges taxcalc-dev.
  #
  # THIS JOB REPLACES DEPLOYMENT FROM CI, and the direction of the arrow is
  # the entire point of the day. Before today a green pipeline meant "CI held
  # cluster credentials and used them"; now the cluster boundary accepts only
  # pulls. This job cannot reach the cluster - it has `contents: read` here
  # and a PAT scoped to the config repo, and nothing else.
  #
  # The spec's literal instruction is "replace ci.yml's deploy-k8s job". This
  # repo never had one: the cluster-touching job has always lived in
  # k8s-ci.yml, and it builds its OWN ephemeral k3d cluster inside the runner
  # rather than authenticating to a standing one, so there were no cluster
  # credentials in this repository to remove - the deliverable's own negative
  # grep for cluster-credential names over .github/ returned zero before this
  # deliverable and returns zero after it (the search terms are deliberately
  # not spelled out here, so the check has no hit a reader must adjudicate -
  # same convention W6 D1 adopted for the AWS key names). That job
  # stays as a manifest-validation gate; taxcalc-api/GITOPS.md records the one
  # real consequence, which is that manifests/ now has a second copy in the
  # config repo's base/ and the two can drift.
  call-bump-config:
    name: Bump gitops config (dev overlay)
    needs: call-build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_bump-config.yml
    with:
      image-name: uptimecrew/taxcalc-api
      image-sha: ${{ github.sha }}
    secrets:
      # Fine-grained PAT scoped to the config repo only (contents: write,
      # pull_requests: write). Deliberately NOT the built-in GITHUB_TOKEN,
      # which is scoped to this repository and can neither push a branch to
      # nor open a PR against the config repo. See _bump-config.yml's header.
      GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
    # Narrower than call-build-and-push on purpose: no packages: write (it
    # pushes no image) and no id-token: write (it assumes no AWS role).
    permissions:
      contents: read
