# .github/workflows/compose-ci.yml
name: taxcalc-api compose-ci

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "compose.override.yaml"
      - "compose.profiles.yaml"
      - "envs/**"
      - "scripts/**"
      - "Makefile"
      - "src/**"
      - "build.gradle"
      - "Dockerfile"
      - ".github/workflows/compose-ci.yml"

permissions:
  contents: read

jobs:
  compose-up-smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 20
    env:
      # Pinned here (job-level, so every step's `docker compose` inherits it)
      # so this job's own "Compose up" step and scripts/smoke.sh's internal
      # `up` resolve to the exact same project. Without this, smoke.sh
      # defaults to its own unique-per-invocation project name and a
      # separate "compose up" step here would stand up a second, colliding
      # stack on the same host ports; with it, smoke.sh's `up` becomes an
      # idempotent no-op against the containers this job already brought
      # healthy, and its teardown tears down the one shared project.
      COMPOSE_PROJECT_NAME: taxcalc_dev_ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uptimecrew/taxcalc-api:0.1.0 is never pushed to a registry (docker.yml
      # builds it with `load: true` for its own scan+smoke job only, PR builds
      # never push - see that workflow's comments) - it only exists as a local
      # image on an engineer's laptop. Build it locally here too, under the
      # exact tag compose.yaml resolves to, or `docker compose up` 404s trying
      # to pull it.
      - name: Build taxcalc-api image
        run: docker build -t uptimecrew/taxcalc-api:0.1.0 --build-arg APP_VERSION=0.1.0 --build-arg GIT_SHA=${{ github.sha }} .

      # CI does NOT have the engineer's envs/secrets on disk - write them
      # here from values acceptable for ephemeral CI use only. The app reads
      # this file via application.yml's `optional:configtree:/run/secrets/`
      # import (property key = filename, "pg_password"), so CI_PG_PASSWORD
      # can be any value here - it no longer has to match a hardcoded
      # fallback the way it did before that import existed.
      - name: Seed envs + secrets for CI
        run: |
          mkdir -p envs secrets
          cp envs/taxcalc.env.example envs/taxcalc.env
          # Dependabot PRs and fork PRs receive NO repository secrets - they
          # read from a separate Dependabot store, or none at all. So
          # CI_PG_PASSWORD arrives EMPTY there, the file below is written
          # empty, and Postgres refuses to initialise with "Database is
          # uninitialized and superuser password is not specified", failing
          # the job for a reason that has nothing to do with the change under
          # test. Measured on Dependabot #38, which failed exactly this way
          # three times in a row while every other check on it passed.
          #
          # As the comment above already notes, this value can be anything:
          # it guards a throwaway container on a job-scoped network that is
          # destroyed with the runner. So generate one when it is absent
          # rather than requiring a secret - which also fixes fork PRs, and
          # removes a CI dependency on a secret that never needed to exist.
          if [ -z "${CI_PG_PASSWORD}" ]; then
            CI_PG_PASSWORD="$(openssl rand -hex 24)"
            echo "::notice::No CI_PG_PASSWORD available (expected on Dependabot" \
                 "and fork PRs); generated an ephemeral one for this run."
          fi
          printf '%s' "$CI_PG_PASSWORD" > secrets/pg_password.txt
        env:
          CI_PG_PASSWORD: ${{ secrets.CI_PG_PASSWORD }}

      - name: Validate compose.yaml schema
        run: docker compose config --quiet

      - name: Compose up --wait
        run: docker compose up -d --wait --wait-timeout 120

      # scripts/smoke.sh's own `up` reuses this same COMPOSE_PROJECT_NAME, so
      # it's idempotent here (containers are already healthy) rather than a
      # second stack. Its trap still tears the (shared) project down before
      # this step returns and, on failure, tees logs to compose-logs.txt.
      - name: Smoke
        run: ./scripts/smoke.sh

      # Two different failures land here differently:
      # - "Compose up --wait" itself failed -> Smoke never ran, so
      #   compose-logs.txt doesn't exist yet, but the containers are still
      #   up (nothing has torn them down) - capture fresh.
      # - Smoke failed internally -> its own trap already wrote
      #   compose-logs.txt AND already tore the stack down, so a fresh
      #   `docker compose logs` here would find nothing; use the file it
      #   left behind instead.
      - name: Capture logs on failure
        if: failure()
        run: |
          if [ ! -s compose-logs.txt ]; then
            docker compose logs --no-color --tail=500 > compose-logs.txt || true
          fi
          cat compose-logs.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 14

      - name: Tear down (always)
        if: always()
        run: docker compose down --volumes --remove-orphans || true
