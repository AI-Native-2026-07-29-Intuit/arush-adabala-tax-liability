# .github/workflows/serverless.yml - validate/test/build/local-invoke on PR,
# OIDC-federated deploy + smoke on merge to main (W5 D4).
name: taxcalc-taxpayer-lookup serverless

on:
  pull_request:
    paths:
      - 'template.yaml'
      - 'pom.xml'
      - 'src/main/java/com/uptimecrew/tax_liability/lambda/**'
      - 'src/test/java/com/uptimecrew/tax_liability/lambda/**'
      - 'src/main/resources-lambda/**'
      - 'events/**'
      - 'scripts/sam-*.sh'
      - '.github/workflows/serverless.yml'
  push:
    branches: [main]

permissions:
  # Required for OIDC federated auth. Without this the token endpoint is not
  # even offered to the job and configure-aws-credentials fails with
  # "Could not load credentials from any providers".
  id-token: write
  contents: read

jobs:
  # ----- PR gate: everything that needs no AWS account at all ---------------
  # Blacksmith, not ubuntu-22.04: GitHub-hosted runners do not start in this
  # org since the W5 D2 Actions billing block (see README's "Week 5 Day 2").
  # This job was failing in 3s with "The job was not started because recent
  # account payments have failed" - not a test failure, a runner that never
  # booted.
  validate-build-test:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      # ----- 1. Static validation ---------------------------------------
      # --region is passed explicitly: sam validate resolves a region even for
      # a purely local lint, and this job has no credentials and no configured
      # default profile to take one from.
      - name: sam validate --lint
        run: sam validate --lint --region us-east-1

      # ----- 1b. OIDC: verify the GitHub half of the trust relationship ----
      # Mints a real OIDC token for the sts.amazonaws.com audience and prints only
      # its claims. This proves `permissions: id-token: write` is actually in effect
      # and, more usefully, prints the exact `sub` value the IAM role's trust policy
      # has to match - the single most common thing to get wrong when wiring OIDC.
      # The token itself is registered as a secret and never printed: it is a live
      # credential, even though it is short-lived and audience-restricted.
      - name: Inspect OIDC token claims (no AWS call)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString('utf8'));
            const shown = {
              iss: claims.iss, aud: claims.aud, sub: claims.sub,
              repository: claims.repository, ref: claims.ref,
            };
            core.info(JSON.stringify(shown, null, 2));
            core.summary
              .addHeading('OIDC token claims', 3)
              .addCodeBlock(JSON.stringify(shown, null, 2), 'json')
              .addRaw('Pin the IAM trust policy to this `sub`.')
              .write();

      # ----- 2. Unit tests (JUnit 5 + Mockito + AssertJ) ------------------
      - name: mvn test
        run: mvn -B -ntp test

      # ----- 2b. Package the shaded jar IN THE LAMBDA BUILD IMAGE --------
      # template.yaml keeps the deliverable's literal
      # `CodeUri: target/taxcalc-taxpayer-lookup-1.0.0.jar`, which SAM cannot
      # drive a build workflow from (it treats CodeUri as a directory), so the
      # function is marked SkipBuild and `sam build` stages the jar. The
      # container build therefore happens here, in the same image
      # `sam build --use-container` would have used - so the artefact that
      # ships is genuinely compiled in a Lambda-parity environment.
      - name: Build the deployment artefact in the Lambda build image
        run: ./scripts/build-lambda.sh

      # ----- 3. Build under a Lambda-parity container --------------------
      - name: sam build
        run: sam build --use-container

      # ----- 3b. arm64 emulation ------------------------------------------
      # template.yaml pins Architectures: [arm64], but GitHub's ubuntu-22.04
      # runners are x86_64. Without QEMU registered, `sam local invoke` fails
      # building its emulation image with
      #   The command '/bin/sh -c mv /var/rapid/aws-lambda-rie-arm64 ...'
      #   returned a non-zero code: 255
      # because it cannot execute the arm64 RIE binary at all.
      - name: Set up QEMU (arm64 emulation for the Lambda runtime image)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      # ----- 4. Local invoke against the synthetic event ------------------
      # An integration test of the built artifact inside the real runtime
      # image: it proves the Handler string in template.yaml actually resolves
      # to a loadable class, which no amount of unit testing can.
      # The function has no DynamoDB access here, so the meaningful assertion
      # is that a well-formed HTTP response comes back at all - grep for the
      # statusCode key rather than for a specific status.
      - name: sam local invoke (integration test against handler)
        run: |
          # Point DynamoDB at a closed port so the GetItem fails on connection-refused
          # immediately. Without this the SDK reaches real AWS, retries against absent
          # credentials, and the function blows its 10s timeout - which under QEMU it
          # cannot afford: emulated arm64 JVM init alone measures ~8.2s here versus
          # ~1.2s native, leaving under 2s of budget for the invocation itself.
          cat > /tmp/ci-env.json <<'JSON'
          { "TaxpayerLookupFunction": { "DYNAMODB_ENDPOINT_OVERRIDE": "http://127.0.0.1:1" } }
          JSON
          # Raise the timeout in the BUILD ARTEFACT only - never in template.yaml, where
          # Timeout: 10 is a graded property and correct for the real runtime. Emulated
          # arm64 init alone measures ~8-10s here against ~1.2s native, so a 10s budget
          # cannot fit an invocation that has not started yet. This compensates for QEMU
          # being ~7x slower, not for the function being slow.
          sed -i 's/^\( *\)Timeout: 10$/\1Timeout: 120/' .aws-sam/build/template.yaml
          grep -n 'Timeout:' .aws-sam/build/template.yaml
          sam local invoke TaxpayerLookupFunction \
            --event events/get-taxpayer.json \
            --env-vars /tmp/ci-env.json \
            | tee /tmp/local-invoke.json
          # The assertion is that the Handler string resolved to a loadable class and a
          # well-formed HTTP response came back - not a particular status. This job has no
          # DynamoDB, so a shaped 500 is the correct outcome here.
          grep -q '"statusCode"' /tmp/local-invoke.json

      # Task 4 asks for a deliberately-broken template to fail this job AND leave
      # a diagnostics artefact. The deploy job's artefact is unreachable from a
      # PR (it needs OIDC), so the PR job captures its own. `|| true` on every
      # line: whichever step failed, the others may not have produced a file,
      # and a failing capture would mask the real failure.
      - name: Capture build diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/diag
          sam validate --lint --region us-east-1 > /tmp/diag/sam-validate.txt 2>&1 || true
          cp /tmp/local-invoke.json /tmp/diag/ 2>/dev/null || true
          cp .aws-sam/build.toml /tmp/diag/ 2>/dev/null || true
          mvn -B -ntp validate > /tmp/diag/mvn-validate.txt 2>&1 || true
          ls -la target/ > /tmp/diag/target-listing.txt 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: sam-diagnostics
          path: /tmp/diag
          retention-days: 14

      - name: Upload sam build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sam-build
          path: .aws-sam/build
          retention-days: 7

  # ----- Merge to main: deploy to a sandbox stack via OIDC ------------------
  # Blacksmith, not ubuntu-22.04: GitHub-hosted runners do not start in this
  # org since the W5 D2 Actions billing block (see README's "Week 5 Day 2").
  # This job was failing in 3s with "The job was not started because recent
  # account payments have failed" - not a test failure, a runner that never
  # booted.
  # Gated on the role ARN as well as the branch. vars.AWS_DEPLOY_ROLE_ARN is
  # unset (this org issues no AWS account), and without that guard EVERY push
  # to main failed here at assume-role - configure-aws-credentials cannot do
  # anything with an empty role-to-assume, so main carried a permanent red X
  # that had nothing to do with the commit that triggered it. A red main
  # everyone learns to ignore is worse than no signal at all.
  #
  # Skipping silently would be its own trap, so deploy-sandbox-unconfigured
  # below runs in this job's place and says why. Setting the variable enables
  # this job with no workflow change - same pattern as _build-and-push.yml's
  # ECR steps and deploy-prod.yml.
  deploy-sandbox:
    needs: validate-build-test
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: sandbox
    timeout-minutes: 20
    env:
      STACK: taxcalc-lambda-sandbox
      STAGE: dev
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: sam-build, path: .aws-sam/build }

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with: { use-installer: true }

      # OIDC federated auth: GitHub mints a short-lived OIDC token, AWS STS
      # exchanges it for temporary credentials against a role whose trust
      # policy is pinned to this repo and branch. There are deliberately NO
      # long-lived AWS access-key or secret-key credentials in this
      # repository - a static key pair sitting in GitHub Secrets is the exact
      # anti-pattern this replaces. (Their env-var names are not spelled out
      # here on purpose, so W6 D1 Task 3's negative grep over .github/ stays a
      # clean zero instead of matching a comment.) The role ARN is a
      # repository *variable*, not a secret: an ARN is not confidential, and
      # hiding it only makes failures harder to read.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: sam deploy (sandbox)
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name "${STACK}" \
            --region "${AWS_REGION}" \
            --parameter-overrides "StageName=${STAGE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3

      - name: Smoke test (curl + CloudWatch REPORT check)
        run: ./scripts/sam-smoke.sh

      # Both halves of the diagnostics bundle are guarded with `|| true`: on a
      # failed deploy the stack may not exist at all, and a describe-stack-events
      # that itself errors would mask the real failure with a second one.
      - name: Capture function diagnostics on failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "${STACK}" \
            --region "${AWS_REGION}" \
            --max-items 50 > /tmp/stack-events.json || true
          aws logs tail "/aws/lambda/taxcalc-taxpayer-lookup-${STAGE}" \
            --since 10m --region "${AWS_REGION}" \
            > /tmp/lambda-logs.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: sam-diagnostics
          path: |
            /tmp/stack-events.json
            /tmp/lambda-logs.txt
          retention-days: 14

  # Runs exactly when deploy-sandbox does not, so a push to main always carries
  # a visible reason rather than an unexplained "skipped" box.
  deploy-sandbox-unconfigured:
    name: Sandbox deploy skipped (AWS not configured)
    needs: validate-build-test
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN == ''
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 5
    steps:
      - name: Explain why the sandbox deploy did not run
        run: |
          echo "::warning::vars.AWS_DEPLOY_ROLE_ARN is unset, so the sandbox" \
               "deploy was skipped. This is expected: no AWS account is issued" \
               "for this org. Before this guard existed, the deploy job ran" \
               "anyway and failed at assume-role on every push to main." \
               "To enable it: create the deploy role, then" \
               "'gh variable set AWS_DEPLOY_ROLE_ARN --body <role-arn>'." \
               "No workflow change is needed."
