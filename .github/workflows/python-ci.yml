# .github/workflows/python-ci.yml
# The Python sidecar gate (W7 D1 Task 4): uv sync --frozen -> ruff check ->
# ruff format --check -> mypy --strict -> pytest with a coverage floor.
#
# Each step is its own block, so a failure names the offending step in the
# GitHub UI rather than hiding inside one long shell line. The gate fails on
# the first non-zero step: a type error is not worth running tests past, and a
# lockfile that does not match pyproject.toml is not worth linting.
name: taxcalc-ai ci

on:
  # PATH-SCOPED ON BOTH TRIGGERS, unlike ci.yml next door, which is
  # deliberately unfiltered on pull_request.
  #
  # That difference is not an oversight, and the reason matters for whoever
  # touches branch protection next. ci.yml is a REQUIRED status check on main,
  # and a required check that is path-filtered is a trap: GitHub waits forever
  # for a context that will never report, so a PR touching none of the filtered
  # paths can never merge. That already stranded four Dependabot PRs here
  # (#39-#42) and is why ci.yml runs its full Testcontainers suite even on
  # docs-only PRs.
  #
  # This workflow is NOT a required check, so the filter is safe and buys back
  # the thing the Java gate had to give up: a Java-only PR does not pay the
  # Python tax, and a Python-only PR does not wait on it either.
  #
  # If this ever becomes a required check, the filter must come off first.
  push:
    branches: [main]
    paths:
      - "taxcalc-ai/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "taxcalc-ai/**"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: python-ci-${{ github.ref }}
  # A PR force-push cancels its own stale run; a push to main is left to finish,
  # since a cancelled main run leaves the branch with no recorded verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job reads the tree and publishes nothing.
permissions:
  contents: read

jobs:
  python-quality-gate:
    name: uv sync + ruff + mypy + pytest
    # Pinned, not ubuntu-latest: `latest` moves under you, and a gate whose
    # runner image changes silently is a gate that can go red for reasons that
    # have nothing to do with the diff.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: taxcalc-ai
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (pinned)
        # SHA-pinned, carrying forward the W6 D1 discipline: a mutable tag on a
        # third-party action is an unreviewed code-execution path into CI.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Pin Python 3.12 via uv
        # uv downloads the interpreter; the runner's system Python is not used,
        # so the version here is the version in .python-version, not whatever
        # the runner image happens to ship.
        run: uv python install 3.12

      - name: uv sync --frozen (fail on lockfile drift)
        # --frozen makes uv.lock the source of truth: if pyproject.toml asks for
        # something the lockfile does not record, this fails rather than
        # silently resolving a different dependency set than anyone tested.
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        # --check reports formatting drift without rewriting the tree: CI
        # reports, it does not edit.
        run: uv run ruff format --check

      - name: mypy --strict
        # tests/ is type-checked too. Untyped tests are where `Any` creeps back
        # in, and a test that does not type-check is a test that may not be
        # exercising the signature it claims to.
        run: uv run mypy --strict src/ tests/

      - name: pytest with coverage
        # -m "not slow" excludes the RAGAS evaluation, and --ignore excludes the Great
        # Expectations suite; both run as their own steps below, with the credentials they need
        # in scope. Running them here as well would double the judging spend and the container
        # work, and would make this step's failure ambiguous between "a unit test broke",
        # "answer quality regressed" and "the data contract broke" - three different problems
        # for three different people. Coverage is unaffected: measured both ways it is 90%,
        # because the modules the GX suite exercises are already covered by the loader tests.
        run: >
          uv run pytest -v -m "not slow"
          --ignore=tests/test_great_expectations_suite.py
          --ignore=tests/test_tenant_isolation.py
          --ignore=tests/test_semantic_cache.py
          --cov=src --cov-fail-under=85

      # ----- W7 D2: the three data + AI-observability gate steps -----------------------------
      #
      # All three run in THIS job rather than a new one, deliberately. They need the same uv
      # environment the steps above built, and a separate job would re-resolve, re-download the
      # ~80 MB sentence-transformers model, and re-pull the pgvector image to check three
      # assertions. A single job also means a failure pinpoints the exact gate in the step list.
      #
      # Every credential arrives from secrets.* and none appears in the tree. The CI LangSmith
      # project is taxcalc-ai-dev-ci, NOT taxcalc-ai-dev: gate runs upload a trace on every
      # push, and mixing that volume into the project an engineer reads while debugging is how
      # a trace view stops being useful.

      - name: Great Expectations checkpoint (Testcontainers Postgres + pgvector)
        # ubuntu-24.04 runners ship a running Docker daemon, which is what Testcontainers needs;
        # no services: block is required because the container is started by the test itself.
        run: uv run pytest -v tests/test_great_expectations_suite.py
        env:
          LANGSMITH_API_KEY: ${{ secrets.TAXCALC_AI_LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: taxcalc-ai-dev-ci
          # Tracing off for this step: it validates data, and its traces would be noise.
          LANGSMITH_TRACING: "false"

      - name: RAGAS golden-set thresholds
        run: uv run pytest -v -m slow tests/test_ragas_thresholds.py
        env:
          LANGSMITH_API_KEY: ${{ secrets.TAXCALC_AI_LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: taxcalc-ai-dev-ci
          LANGSMITH_TRACING: "true"
          # RAGAS judges answers rather than producing them, so the evaluator may be a smaller
          # and cheaper model than production.
          ANTHROPIC_API_KEY: ${{ secrets.TAXCALC_AI_ANTHROPIC_API_KEY }}
          # No unsolicited telemetry to a third party on every build. Also removes the unclosed
          # file handle RAGAS's analytics module leaks, which this project's warnings-as-errors
          # policy would otherwise fail the run on.
          RAGAS_DO_NOT_TRACK: "true"

      # ----- W7 D3: the four RAG 2.0 gate steps ---------------------------------------------
      #
      # Same job again, same reasoning as the W7 D2 block: these need the uv environment the
      # steps above built, and a new job would re-resolve, re-download the ~80 MB MiniLM model
      # and the ~1.1 GB bge-reranker, and re-pull the pgvector and Redis images.
      #
      # ORDERED CHEAPEST-FIRST, and the order carries information. The DAG import check is a
      # second and needs no container, so it runs first: a typo in the DAG has nothing to do
      # with retrieval quality and should not be discovered after twenty minutes of judging.
      # The tenant-isolation and cache steps come next (containers, no model judging), and the
      # RAGAS faithfulness gate last, because it is the only step that spends money.

      - name: Airflow DAG import check
        # The bar is importability, not a running scheduler - this catches a bad decorator
        # argument, a missing dependency and a typo'd task edge, which is what actually breaks.
        run: >
          uv run python -c
          "from taxcalc_ai.dags.rag_svc_ingest import taxcalc_ai_ingest_dag"

      - name: Tenant + metadata isolation (Testcontainers Postgres + pgvector)
        # Asserts the DATABASE-side tenant_id of every returned chunk, not the tenant_id the
        # request passed in - the latter compares a value to itself and passes against a
        # retriever with no WHERE clause at all.
        run: uv run pytest -v tests/test_tenant_isolation.py
        env:
          LANGSMITH_API_KEY: ${{ secrets.TAXCALC_AI_LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: taxcalc-ai-dev-ci
          LANGSMITH_TRACING: "false"

      - name: Semantic cache smoke test (Testcontainers Redis)
        # Near-duplicate collision, cross-tenant refusal at both layers, and epoch invalidation.
        run: uv run pytest -v tests/test_semantic_cache.py
        env:
          LANGSMITH_API_KEY: ${{ secrets.TAXCALC_AI_LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: taxcalc-ai-dev-ci
          LANGSMITH_TRACING: "false"

      # Named for the metric, not the number. The threshold lives in FAITHFULNESS_GATE and moved
      # 0.85 -> 0.70 on 2026-09-18 when the gate was first actually measured; a step name carrying
      # a copy of it is a fourth place to drift, and unlike the other three no test can pin it.
      - name: RAGAS faithfulness gate
        # The W7 D3 gate. faithfulness is fatal (SystemExit); the other three metrics are
        # asserted floors that diagnose the cause rather than being the user-facing failure.
        #
        # A SKIP HERE IS NOT A PASS. conftest.py re-reports every skip as a ::warning::
        # annotation and a job-summary line, so "the evaluator was unreachable and nothing was
        # measured" is visible on the run page instead of rendering as a green check.
        run: uv run pytest -v -m slow tests/test_ragas_gate.py
        env:
          LANGSMITH_API_KEY: ${{ secrets.TAXCALC_AI_LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: taxcalc-ai-dev-ci
          LANGSMITH_TRACING: "true"
          ANTHROPIC_API_KEY: ${{ secrets.TAXCALC_AI_ANTHROPIC_API_KEY }}
          RAGAS_DO_NOT_TRACK: "true"

      - name: Assert a LangSmith run is visible for a sample retrieval
        # The only step that proves tracing WORKS rather than that the decorator is written.
        #
        # One command, and the same one a developer runs locally. This step used to be thirty
        # lines of inline Python that started a pgvector container, applied the DDL, embedded
        # the seed corpus and exported the DSN before handing off to the checker - none of which
        # was type-checked, linted or covered, and all of which meant the documented invocation
        # did not work anywhere but here. That provisioning now lives inside the script, where
        # tests/test_assert_langsmith_run_visible.py can reach it.
        #
        # LANGSMITH_TRACING is still pinned explicitly rather than left to the script's default:
        # what CI traces should be a property of the pipeline, stated where the pipeline can be
        # read, not inherited from a fallback inside a module.
        run: uv run python -m taxcalc_ai.scripts.assert_langsmith_run_visible
        env:
          LANGSMITH_API_KEY: ${{ secrets.TAXCALC_AI_LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: taxcalc-ai-dev-ci
          LANGSMITH_TRACING: "true"
