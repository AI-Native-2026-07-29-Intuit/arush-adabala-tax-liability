# .github/workflows/deploy-prod.yml
# Promotes a SHA-tagged image already in ECR to the prod environment.
# Triggered manually via workflow_dispatch with the image SHA as input.
# The dev environment auto-deploys on merge to main (via _build-and-push.yml).
# prod is human-gated: the 'prod' GitHub Environment carries a required-reviewer
# rule, so a dispatch parks on "Waiting for review" until a named reviewer
# approves it. Three gates apply, none of them in version control except this
# file's own concurrency block - see .github/PIPELINE.md, "Repository
# protection": required reviewers, the main-only deployment-branch policy, and
# the queue below.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      image-sha:
        description: Image SHA tag already pushed to ECR (40-hex git SHA).
        required: true
        type: string

permissions:
  contents: read

# Prod deploys MUST queue, never race. Two reviewers approving back-to-back
# on different SHAs would otherwise apply both manifests in undefined order.
concurrency:
  group: deploy-prod-taxcalc-api
  cancel-in-progress: false

jobs:
  promote:
    name: Promote image to prod
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 15
    # Two rules, both enforced: deployment branches restricted to main, and
    # required reviewers (ArushAdabala + yusufumautiauptimecrew). The job does
    # not start until one of them approves. Both were impossible while this repo
    # was private on a free plan (422 on required_reviewers and wait_timer
    # alike); making the repo public on 2026-09-04 lifted that gate.
    # prevent_self_review is off - the dispatcher may approve their own run.
    environment: prod
    permissions:
      contents: read
      id-token: write # OIDC token for assuming the prod role
    steps:
      # inputs.* reach bash through env, never string-interpolation: a dispatch
      # input pasted straight into a `run:` block is a shell-injection sink, and
      # validating it in a block that already interpolated it validates nothing.
      - name: Validate input SHA is a 40-char hex
        env:
          IMAGE_SHA: ${{ inputs.image-sha }}
        run: |
          if [[ ! "${IMAGE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::image-sha must be a 40-char git SHA, got '${IMAGE_SHA}'"
            exit 1
          fi

      - name: AWS wiring not configured - ECR confirmation will be skipped
        if: vars.AWS_ACCOUNT_ID == ''
        run: |
          echo "::warning::vars.AWS_ACCOUNT_ID is unset, so the prod role cannot be" \
               "assumed and the ECR image check is skipped. This run still exercises the" \
               "environment gate and the concurrency queue. To enable the AWS path: run" \
               "scripts/docker-oidc-bootstrap.sh against the target AWS account, then" \
               "'gh variable set AWS_ACCOUNT_ID --body <account-id>'. No workflow change" \
               "needed. Do NOT point this at the floci emulator - a GitHub-hosted runner" \
               "cannot reach a laptop, and floci does not verify OIDC tokens."

      - name: Configure AWS credentials via OIDC (prod role)
        if: vars.AWS_ACCOUNT_ID != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/taxcalc-api-prod-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gh-prod-${{ github.run_id }}

      - name: Confirm image exists in ECR
        if: vars.AWS_ACCOUNT_ID != ''
        env:
          IMAGE_SHA: ${{ inputs.image-sha }}
        run: |
          aws ecr describe-images \
            --repository-name uptimecrew/taxcalc-api \
            --image-ids "imageTag=${IMAGE_SHA}"

      # W6 D3 fills in the kubectl rollout + Argo CD manifest-repo commit
      # (see README's "Week 5 Day 3" section for the Deployment this
      # promotes); today stops here, with the prod role assumed and the
      # image's existence in ECR confirmed - the graded scope for this
      # deliverable, per the lesson's own "What this pipeline does NOT do
      # (yet)" list.
      - name: Placeholder for kubectl rollout
        env:
          IMAGE_SHA: ${{ inputs.image-sha }}
        run: echo "Would apply k8s manifests with image=${IMAGE_SHA}"
