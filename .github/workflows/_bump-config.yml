# .github/workflows/_bump-config.yml
#
# Reusable workflow: open a PR against the GitOps config repo
# (AI-Native-2026-07-29-Intuit/arush-adabala-tax-liability-config) bumping the
# dev overlay's image tag to a freshly-pushed SHA. Called from ci.yml on push
# to main after call-build-and-push succeeds.
#
# THIS IS THE WHOLE POINT OF W6 D2. Until today the pipeline reached INTO the
# cluster: k8s-ci.yml stood up a cluster and ran `kubectl apply -f manifests/`,
# so a green build meant "CI had cluster credentials and used them". The
# cluster boundary now only accepts pulls - Argo CD lives inside it, watches
# the config repo, and this workflow's most important property is what it does
# NOT do. It holds no cluster credentials of any kind, assumes no cluster
# role, and cannot deploy anything. It writes one line of YAML in another Git
# repository and stops.
#
# (Spelled that way on purpose: the deliverable's own negative check greps
# .github/ for cluster-credential env-var names, and a check whose one hit is
# a comment saying "we don't use these" is a check a reader has to
# adjudicate. Same convention W6 D1 adopted for the AWS key names - see the
# README's Week 6 Day 1 section.)
#
# The leading underscore is a naming convention only (it sorts to the top of
# .github/workflows/ and signals that this file is not a top-level entry
# point), matching _build-and-push.yml. GitHub does not enforce it.
#
# CREDENTIAL: `secrets.GITOPS_REPO_TOKEN`, a fine-grained PAT scoped to the
# config repo ONLY, with `contents: write` + `pull_requests: write`. The
# workflow's built-in GITHUB_TOKEN deliberately cannot be used - it is scoped
# to THIS repository, so it can neither push a branch to nor open a PR against
# the config repo. Scoping the PAT the other way round matters just as much:
# this token must not be able to write to the application repo, or a
# compromised CI run could rewrite its own pipeline.
name: _bump-config

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image repository as it appears in the Kustomize overlay, e.g. uptimecrew/taxcalc-api"
        required: true
        type: string
      image-sha:
        description: "Immutable tag to pin - the git SHA the image was built from and pushed as"
        required: true
        type: string
      config-repo:
        description: "owner/repo of the GitOps config repository"
        required: false
        default: AI-Native-2026-07-29-Intuit/arush-adabala-tax-liability-config
        type: string
      overlay-path:
        description: "Overlay whose image tag is bumped. dev only - staging and prod are promoted by a human."
        required: false
        default: overlays/dev
        type: string
    secrets:
      GITOPS_REPO_TOKEN:
        required: true

  # A MANUAL ENTRY POINT, and it exists because of a gap the deliverable's own
  # rubric exposed. `call-bump-config` in ci.yml is gated to `push` on `main`,
  # so on a feature branch every ci.yml run is a `pull_request` event and this
  # workflow never executes at all. That makes it unprovable before the merge
  # that makes it live - the one job in the pipeline whose first real run is
  # in production, which is precisely the property CI is supposed to remove.
  #
  # It also separates two failures that otherwise arrive together. This path
  # rebuilds and pushes nothing; it only checks out the config repo, rewrites
  # a tag and opens a PR. So a red run here is unambiguously a CREDENTIAL or
  # PR-creation problem, not a build one - which is the exact question left
  # open while GITOPS_REPO_TOKEN sits pending org approval. Dispatch it with a
  # SHA that already has an image, and the result answers "is the PAT live
  # yet?" in about forty seconds without touching a registry.
  #
  # Two things to know before reaching for it. GitHub only offers a
  # workflow_dispatch entry for a file present on the DEFAULT branch, so this
  # cannot be run until PR #45 merges. And a PR opened this way is a real PR
  # against the config repo - close it, or merge it and let Argo CD deploy
  # that SHA. There is no dry-run mode, deliberately: a dry run would exercise
  # everything except the write, and the write is the part in doubt.
  workflow_dispatch:
    inputs:
      image-sha:
        description: "Git SHA to pin. Must already exist as a pushed image tag."
        required: true
        type: string
      image-name:
        description: "Image repository as it appears in the Kustomize overlay"
        required: false
        default: uptimecrew/taxcalc-api
        type: string
      config-repo:
        description: "owner/repo of the GitOps config repository"
        required: false
        default: AI-Native-2026-07-29-Intuit/arush-adabala-tax-liability-config
        type: string
      overlay-path:
        description: "Overlay whose image tag is bumped"
        required: false
        default: overlays/dev
        type: string

# `contents: read` on THIS repository - the job checks nothing else out of it
# and, critically, needs no cluster access at all. The write it performs
# happens in the config repo and is authorised entirely by the PAT above, not
# by this grant. A reviewer scanning for "what can this pipeline touch?"
# should be able to stop reading here.
permissions:
  contents: read

jobs:
  bump:
    name: Bump the dev overlay image tag and open a PR
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 5
    # Two pushes to main landing back-to-back would otherwise race to create
    # branches and open PRs against the same file. Queue rather than cancel:
    # a cancelled bump silently drops a SHA that was really pushed to the
    # registry, and the config repo would then pin an older image than the
    # newest green build - the exact drift GitOps exists to prevent.
    concurrency:
      group: bump-config-${{ inputs.image-name }}
      cancel-in-progress: false
    steps:
      - name: Check out the gitops config repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.config-repo }}
          # PAT scoped to the config repo only - see this file's header for
          # why the built-in GITHUB_TOKEN cannot do this.
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0

      # NOT `kustomize edit set image`, and the first real run is why.
      #
      # `kustomize edit set image NAME=NAME:SHA` sets BOTH newName and newTag.
      # The dev overlay carries `newName: ghcr.io/ai-native-2026-07-29-intuit/
      # taxcalc-api`, so passing the bare `uptimecrew/taxcalc-api` as the
      # target reset newName to the bare name and threw the registry away.
      # The rendered Deployment then pointed at an image that does not exist
      # anywhere, and dev would have gone ImagePullBackOff on merge.
      #
      # THE OLD GUARD PASSED BECAUSE OF THE BUG. It grepped the rendered
      # output for `image: <image-name>:<sha>` - and once newName was
      # clobbered, the rendered image was EXACTLY that. An assertion written
      # to catch a silently-inert edit was satisfied precisely by the edit
      # that broke the registry. It is checked against the effective
      # reference below instead, computed from the file rather than assumed.
      #
      # `kustomize edit` also rewrites the whole file through its YAML
      # serialiser: list indentation is flattened, map keys are alphabetised,
      # and blocks move - which detaches this repo's comments from the fields
      # they explain. Every bump degraded the documentation a little. A
      # surgical newTag rewrite touches one line and leaves the rest byte for
      # byte, which also makes the PR diff readable.
      - name: Rewrite the image tag on the dev overlay
        working-directory: gitops/${{ inputs.overlay-path }}
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_SHA: ${{ inputs.image-sha }}
        run: |
          set -euo pipefail

          # Rewrites ONLY the newTag value of the images: entry whose name
          # matches IMAGE_NAME. newName is read, never written, so whatever
          # registry the overlay pins survives the bump.
          python3 - <<'PY'
          import os, re, sys

          name, sha = os.environ["IMAGE_NAME"], os.environ["IMAGE_SHA"]
          path = "kustomization.yaml"
          lines = open(path).read().splitlines(keepends=True)

          entry = None
          for i, line in enumerate(lines):
              m = re.match(r"^(\s*)-\s+name:\s*[\"']?" + re.escape(name) + r"[\"']?\s*$", line)
              if m:
                  entry = (i, len(m.group(1)))
                  break
          if entry is None:
              sys.exit(f"no images: entry with name '{name}' in {path}")

          start, indent = entry
          # The entry runs until the next list item at the same indent, or a
          # line dedented past it.
          end = len(lines)
          for j in range(start + 1, len(lines)):
              s = lines[j]
              if not s.strip() or s.lstrip().startswith("#"):
                  continue
              cur = len(s) - len(s.lstrip())
              if cur <= indent:
                  end = j
                  break

          effective, tag_line = name, None
          for j in range(start, end):
              m = re.match(r"^(\s*)newName:\s*[\"']?([^\"'\s]+)[\"']?\s*$", lines[j])
              if m:
                  effective = m.group(2)
              if re.match(r"^\s*newTag:\s*", lines[j]):
                  tag_line = j

          if tag_line is None:
              sys.exit(f"images: entry for '{name}' has no newTag: to rewrite")

          # Preserve the original indentation, key spacing and quoting style.
          m = re.match(r"^(\s*newTag:\s*)([\"']?)[^\"'\s]*([\"']?)\s*$", lines[tag_line])
          lines[tag_line] = f"{m.group(1)}{m.group(2)}{sha}{m.group(3)}\n"

          open(path, "w").write("".join(lines))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"EFFECTIVE_IMAGE={effective}\n")
          print(f"newTag -> {sha}; effective image reference {effective}")
          PY

          # Render before opening the PR. An edit can happily leave a
          # kustomization.yaml that does not build - a bad path, a patch whose
          # target no longer exists - and without this the first thing to
          # notice would be Argo CD failing to sync AFTER a human merged it.
          # Failing here costs one red CI job; failing there costs a
          # ComparisonError on a live environment and a Slack alert at
          # whatever hour the merge happened.
          kustomize build . > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

          # Assert against the EFFECTIVE reference - newName if the overlay
          # sets one, otherwise name - so the registry is part of the claim.
          # Checking the rendered output rather than the kustomization file
          # still matters for the original reason: `images:` only takes effect
          # if `name:` matches the image reference in the base Deployment, and
          # a rename in the base would leave this edit silently inert.
          grep -q "image: ${EFFECTIVE_IMAGE}:${IMAGE_SHA}" /tmp/rendered.yaml

          # And assert the registry did not vanish, which is the specific
          # regression that shipped once already.
          case "${EFFECTIVE_IMAGE}" in
            */*/*|*.*/*) ;;
            *) echo "::error::effective image '${EFFECTIVE_IMAGE}' has no registry host - newName was lost" && exit 1 ;;
          esac

      - name: Open a PR against the gitops repo
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          BR="bump-${{ inputs.image-sha }}"

          # Idempotent: a re-run of the same workflow (or a retry after a
          # transient failure) must not fail on "branch already exists" or
          # open a second PR for one SHA.
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            echo "Branch $BR already exists on the config repo - nothing to do."
            exit 0
          fi

          git config user.name  "uptimecrew-ci"
          git config user.email "ci@uptimecrew.example.internal"
          git checkout -b "$BR"
          git add "${{ inputs.overlay-path }}/kustomization.yaml"

          # A no-op bump is a success, not a failure: pushing the same image
          # twice (a re-run, or a main commit that changed nothing the image
          # depends on) leaves the overlay byte-identical, and `git commit`
          # exits non-zero on an empty tree.
          if git diff --cached --quiet; then
            echo "Overlay already pins ${{ inputs.image-sha }} - nothing to do."
            exit 0
          fi

          git commit -m "bump(dev): ${{ inputs.image-name }} -> ${{ inputs.image-sha }}"
          git push -u origin "$BR"

          gh pr create \
            --base main \
            --head "$BR" \
            --title "bump(dev): ${{ inputs.image-name }} -> ${{ inputs.image-sha }}" \
            --body "Automated bump from upstream CI run ${{ github.run_id }} in \
          ${{ github.repository }} (commit ${{ github.sha }}).

          Merging this PR is what deploys. Argo CD polls this repository roughly
          every 3 minutes; the next poll after the merge renders \
          \`${{ inputs.overlay-path }}\` and converges \`taxcalc-dev\`. Nothing in the
          application repo's pipeline can reach the cluster."
