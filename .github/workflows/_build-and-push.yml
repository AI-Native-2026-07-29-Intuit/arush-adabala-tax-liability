# .github/workflows/_build-and-push.yml
# Reusable workflow: build + Trivy scan + push to ECR via OIDC. Called from
# ci.yml's call-build-and-push job on push to main; never invoked directly
# by a UI dispatch. The leading underscore is a naming convention only (it
# sorts to the top of .github/workflows/ for visibility and signals to
# humans - and to GitHub's own recent-runs UI - that this file is not a
# top-level entry point), not something GitHub itself enforces.
#
# Task 2 state: only the build half (composite action + Buildx + a local
# `load: true` build, no push). Task 3 adds the OIDC role assumption, ECR
# login, Trivy gate, and the real push step.
name: _build-and-push

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      ecr-repo:
        required: true
        type: string

jobs:
  build-scan-push:
    name: Build, Trivy scan, push to ECR
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 20
    steps:
      - name: Set up build env (composite)
        uses: ./.github/actions/setup-build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build image (load to local docker for scan)
        id: build-local
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          load: true
          tags: ${{ inputs.image-name }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Task 3: OIDC role assumption, ECR login, Trivy scan (fail on
      # HIGH/CRITICAL), and the real push (SHA tag + main tag) land here.
